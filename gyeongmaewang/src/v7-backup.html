}

/* ---------- 탱크옥션 등 붙여넣기 파서 (관대하게) ---------- */
function realMoney(s){
  if(!s) return 0; s = String(s);
  let m = s.match(/(\d+)\s*억\s*([\d,]*)\s*(만)?/);
  if(m){ const eok = +m[1], rest = +(m[2]||"0").replace(/,/g,""); return eok*10000 + (m[3] ? rest : (rest>=10000 ? Math.round(rest/10000) : rest)); }
  m = s.match(/([\d,]{4,})\s*원/); if(m) return Math.round(+m[1].replace(/,/g,"")/10000);
  m = s.match(/([\d,]+)\s*만/); if(m) return +m[1].replace(/,/g,"");
  m = s.match(/([\d,]{7,})/); if(m) return Math.round(+m[1].replace(/,/g,"")/10000);
  return 0;
}
function realParse(text){
  const out = {src:"paste", title:"붙여넣은 물건", rights:[], tenants:[], cost:300, tax:0, acqRate:1.1, extra:300, profit:1000, warn:[]};
  const T = String(text||"").replace(/\r/g,"").replace(/ /g," ");
  let m = T.match(/(\d{4})\s*타경\s*(\d+)/); if(m) out.caseNo = `${m[1]}타경${m[2]}`;
  const money = (label) => { const mm = T.match(new RegExp(label + "(?:[^\\d]|\\d{1,3}(?:\\.\\d+)?\\s*%){0,40}?(\\d+\\s*억[\\d,\\s]*만?|[\\d,]{7,}\\s*원?)")); return mm ? realMoney(/원|억|만/.test(mm[1]) ? mm[1] : mm[1] + "원") : 0; };
  out.appraisal = money("감\\s*정\\s*(?:평가)?\\s*(?:가|액|금액)");
  out.minBid = money("최\\s*저\\s*(?:매각)?\\s*(?:가|가격|입찰가)");
  
  out.sale = out.minBid || (out.appraisal ? r100(out.appraisal*0.8) : 0);
  out.sellPrice = out.appraisal || 0;
  const DATE = /(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/;
  /* 임차인: '전입'이 나오는 곳마다 앞뒤 구간을 잘라 읽는다 */
  const tenantSpans = [];
  const re = /전입/g; let mm; const idxs = [];
  while((mm = re.exec(T))) idxs.push(mm.index);
  const noMove = /전입\s*(일자?)?\s*[:：]?\s*(미상|없음|-)/;
  idxs.forEach((ix, n) => {
    if(n>0 && ix - idxs[n-1] < 25) return; /* 한 칸 안의 '전입' 중복 */
    const st = Math.max(0, ix - 60), en = Math.min(T.length, (idxs.find(v=>v>ix+25) || ix+220));
    const w = T.slice(st, en); tenantSpans.push([st,en]);
    const after = (kw) => { const p = w.search(kw); if(p<0) return null; const d = w.slice(p).match(DATE); return d ? `${d[1]}.${d[2].padStart(2,"0")}.${d[3].padStart(2,"0")}` : null; };
    const move = noMove.test(w) ? "" : (after(/전입/) || "");
    const fix = after(/확정/) || "";
    const demand = /배당\s*(요구)?\s*[:：]?\s*(\d{4}|있음|O|○|함)/.test(w) && !/배당\s*(요구)?\s*[:：]?\s*(없음|X|×|안\s*함|미신청)/.test(w);
    let dep = 0; const dm = w.match(/보(?:증금)?\s*[:：]?\s*([\d,]+\s*원|\d+\s*억[\d,\s]*만?|[\d,]+\s*만)/); if(dm) dep = realMoney(dm[1]);
    if(!dep){ const am = w.match(/([\d,]{7,}\s*원|\d+\s*억[\d,\s]*만?)/); if(am) dep = realMoney(am[1]); }
    out.tenants.push({name:`임차인 ${out.tenants.length+1}`, move, fix, demand, dep, prio:0});
  });
  /* 등기: 날짜와 권리 키워드가 같이 있는 줄(또는 바로 다음 줄) */
  const KW = /(소유권\s*이전|소유권\s*보존|근저당|저당권|가압류|압류|담보가등기|가등기|가처분|전세권|지상권|지역권|임차권|임의경매|강제경매|경매개시)/;
  const lines = T.split("\n"); let pos = 0; const seen = new Set();
  lines.forEach((ln, li) => {
    const start = pos; pos += ln.length + 1;
    if(tenantSpans.some(([a,b]) => start >= a && start < b && /전입|확정|배당/.test(ln))) return;
    let seg = ln; let d = seg.match(DATE), kw = seg.match(KW);
    if(d && !kw && lines[li+1]){ seg = ln + " " + lines[li+1]; kw = seg.match(KW); }
    if(!d && kw && li>0){ const prev = lines[li-1]; const pd = prev.match(DATE); if(pd && !prev.match(KW)){ seg = prev + " " + ln; d = pd; } }
    if(!d || !kw) return;
    const date = `${d[1]}.${d[2].padStart(2,"0")}.${d[3].padStart(2,"0")}`;
    const key = date + kw[1].replace(/\s/g,"");
    if(seen.has(key)) return; seen.add(key);
    let type = kw[1].replace(/\s/g,"");
    if(/가등기/.test(type) && /담보/.test(seg)) type = "담보가등기";
    const noM = seg.match(/제\s*(\d+)\s*호/);
    const amt = realMoney(seg.replace(DATE, " "));
    const note = /철거|인도/.test(seg) ? "건물철거·토지인도" : (/말소기준/.test(seg) ? "사이트 표시: 말소기준" : "");
    const demand = /전세권/.test(type) && /배당요구|경매신청|신청채권자/.test(seg);
    out.rights.push({type, date, no: noM ? +noM[1] : "", holder:"", amt: amt || "", note, demand});
  });
  if(!out.rights.length) out.warn.push("등기 권리를 한 줄도 못 읽었어요. 아래 표에 직접 넣거나, 등기부(등기권리) 부분을 포함해서 다시 복사해 주세요.");
  if(!out.tenants.length) out.warn.push("임차인 정보를 못 찾았어요. 임차인이 없는 물건이면 그대로 두고, 있으면 직접 추가하세요.");
  if(!out.sale) out.warn.push("감정가·최저가를 못 찾았어요. 예상 낙찰가를 직접 넣어 주세요.");
  return out;
}

  if((b = e.target.closest("[data-rtdel]"))){ realReadForm(); RP.parsed.tenants.splice(+b.dataset.rtdel,1); RP.parsed.tenants.forEach((t,i)=>t.name=`임차인 ${i+1}`); renderReal(); return; }
  if(e.target.closest("#rReport") || (e.target.closest("#rSolveThis"))){
    const solve = !!e.target.closest("#rSolveThis");
    if(RP.view==="input"){ realReadForm(); RC = realToCase(RP.parsed); }
    const bad = RC.rights.filter(r=>!realD(r.date)).length;
    if(RP.view==="input" && bad && !confirm(`날짜를 못 읽은 권리 ${bad}건은 빼고 계산해요. 계속할까요?`)) return;
    realNewCase(RC); RP.view = solve ? "solve" : "report"; renderReal(); window.scrollTo(0,0); return;
  }
  if(e.target.closest("#rBackEdit")){ RP.view="input"; if(realTab!=="paste") realTab="paste"; renderReal(); return; }
});
function realKeepInputs(){ if(!RA) return; document.querySelectorAll("[data-rgot]").forEach(el => RA.got[+el.dataset.rgot] = el.value.replace(/[^\d]/g,"")); const i = $("#rInsu"); if(i) RA.insu = i.value.replace(/[^\d]/g,""); }
document.addEventListener("input", e => { if(page!=="real") return; if(e.target.matches("[data-rgot],#rInsu")) realKeepInputs(); if(e.target.id==="rPaste") RP.text = e.target.value; });

/* ============================== 실전 — 케이스 스터디 (명도·매도·상가·지분 상황극) ============================== */
let CS = null;   /* {id, step, picks:[]} */
const CASE_CATS = ["명도","매도·임대","선순위 임차인","상가","지분"];
const G_LABEL = ["아쉬운 선택","괜찮은 선택","가장 좋은 선택"], G_COLOR = ["var(--seal)","var(--warn)","var(--ok)"];
function caseRec(){ if(!S.cases) S.cases = {}; return S.cases; }
function caseListHTML(){
  const rec = caseRec();
  const done = CASES.filter(c=>rec[c.id]).length;
  return `<p class="lead">명도·매도·상가·지분에서 실제로 나오는 장면을 따라가며 <b>“나라면 어떻게 할까”</b>를 골라 보세요. 고를 때마다 왜 좋은지·왜 위험한지 바로 알려 드려요.</p>
    <div class="note" style="margin-bottom:10px">푼 케이스 ${done} / ${CASES.length}</div>
    ${CASE_CATS.filter(k=>CASES.some(c=>c.cat===k)).map(k=>`<div class="h2row" style="margin-top:6px"><h2 style="font-size:18px">${k}</h2></div>
      <div class="cgrid">${CASES.filter(c=>c.cat===k).map(c=>{ const r = rec[c.id];
        return `<button type="button" class="panel ccard" data-case="${c.id}"><span class="ctitle">${esc(c.title)}</span><span class="note">${"★".repeat(c.lv)}${"☆".repeat(3-c.lv)} · 장면 ${c.steps.length}개${r?` · <b style="color:var(--ok)">최고 ${r.best}%</b>`:""}</span></button>`; }).join("")}</div>`).join("")}`;
}
function casePlayHTML(){
  const c = CASES.find(x=>x.id===CS.id);
  const facts = c.facts && c.facts.length ? `<div class="facts" style="display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px">${c.facts.map(f=>`<span>${esc(f[0])} <b>${esc(f[1])}</b></span>`).join("")}</div>` : "";
  const shown = c.steps.slice(0, CS.step+1).map((s, si) => {
    const pick = CS.picks[si];
    const opts = CS.ord[si].map(oi => { const o = s.o[oi];
      const chosen = pick===oi, reveal = pick!==undefined;
      const st = reveal ? (chosen ? `border-color:${G_COLOR[o.g]};background:var(--sheet2)` : (o.g===2 ? `border-color:var(--ok)` : "opacity:.72")) : "";
      return `<li><button type="button" class="copt" data-cpick="${si}:${oi}" ${reveal?"disabled":""} style="${st}"><span>${esc(o.t)}</span>${reveal && (chosen || o.g===2) ? `<span class="cfb"><b style="color:${G_COLOR[o.g]}">${chosen?"내 선택 · ":""}${G_LABEL[o.g]}</b> — ${esc(o.fb)}</span>` : ""}</button></li>`;
    }).join("");
    return `<div class="panel pad cscene"><div class="note" style="font-weight:700">장면 ${si+1} / ${c.steps.length}</div>
      <p style="margin:6px 0 8px;white-space:pre-line">${esc(s.scene)}</p><div style="font-weight:800;margin-bottom:6px">${esc(s.q||"당신이라면?")}</div>
      <ul class="copts">${opts}</ul>${pick!==undefined?`<div class="ckey">💡 ${esc(s.why)}</div>`:""}</div>`;
  }).join("");
  const cur = CS.picks[CS.step];
  const last = CS.step === c.steps.length-1;
  let foot = "";
  if(cur!==undefined && !last) foot = `<button type="button" class="btn pri" id="cNext">다음 장면 →</button>`;
  if(cur!==undefined && last){
    const got = CS.picks.reduce((s,p,i)=>s+c.steps[i].o[p].g,0), max = c.steps.length*2, pct = Math.round(got/max*100);
    foot = `<div class="panel score"><h3>${pct>=85?"실전 감각 좋아요":pct>=60?"절반 이상 잘 골랐어요":"다시 한 번 따라가 볼까요"} — ${pct}%</h3>
      <div style="font-weight:700;margin-top:6px">📌 이 케이스 정리</div><ul>${c.lesson.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
      ${c.trap?`<div class="ckey" style="border-color:var(--warn)">⚠️ ${esc(c.trap)}</div>`:""}
      <div class="row" style="justify-content:flex-start;gap:8px;margin-top:10px"><button type="button" class="btn" id="cAgain">다시 풀기</button><button type="button" class="btn" id="cList">케이스 목록</button>${nextCase(c)?`<button type="button" class="btn seal" id="cNextCase">다음 케이스 →</button>`:""}</div></div>`;
  }
  return `<div style="display:grid;gap:12px"><div class="row" style="justify-content:flex-start"><button type="button" class="btn" id="cList">← 목록</button><span class="note">${esc(c.cat)} · ${"★".repeat(c.lv)}</span></div>
    <div class="panel pad"><div style="font-weight:800;font-size:18px">${esc(c.title)}</div><p style="margin:6px 0">${c.setup}</p>${facts}</div>${shown}${foot}</div>`;
}
function nextCase(c){ const i = CASES.indexOf(c); return CASES[i+1] || null; }
function caseStart(id){ const c = CASES.find(x=>x.id===id); CS = {id, step:0, picks:[], ord: c.steps.map(st => shuffle(st.o.map((_,i)=>i)))}; }
document.addEventListener("click", e => {
  if(page!=="real" || realTab!=="cases") return;
  let b;
  if((b = e.target.closest("[data-case]"))){ caseStart(b.dataset.case); renderReal(); window.scrollTo(0,0); return; }
  if((b = e.target.closest("[data-cpick]")) && CS){ const [si,oi] = b.dataset.cpick.split(":").map(Number); if(CS.picks[si]===undefined && si===CS.step){ CS.picks[si] = oi;
      const c = CASES.find(x=>x.id===CS.id); if(si===c.steps.length-1){ const pct = Math.round(CS.picks.reduce((s,p,i)=>s+c.steps[i].o[p].g,0)/(c.steps.length*2)*100); const rec = caseRec(); rec[c.id] = {best: Math.max(pct, (rec[c.id]||{}).best||0), last:pct}; save(); }
      renderReal(); } return; }
  if(e.target.closest("#cNext") && CS){ CS.step++; renderReal(); const el = document.querySelectorAll(".cscene"); if(el.length) el[el.length-1].scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(e.target.closest("#cAgain") && CS){ caseStart(CS.id); renderReal(); window.scrollTo(0,0); return; }
  if(e.target.closest("#cList")){ CS = null; renderReal(); window.scrollTo(0,0); return; }
  if(e.target.closest("#cNextCase") && CS){ const n = nextCase(CASES.find(x=>x.id===CS.id)); if(n){ caseStart(n.id); renderReal(); window.scrollTo(0,0); } return; }
});

render();
</script>
