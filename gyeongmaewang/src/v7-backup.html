<title>권리분석 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#F2F4F3; --sheet:#FFFFFF; --sheet2:#F8FAF9;
  --ink:#1B2430; --ink2:#465262; --muted:#687483;
  --line:#D6DCE0; --rule:#A8B6C2;
  --seal:#C0342A; --seal-soft:#F8E4E1;
  --blue:#2D5677; --blue-soft:#E2EBF2;
  --mark:#F3D35A;
  --ok:#2B7A4B; --ok-soft:#E0F0E6;
  --warn:#9A6200; --warn-soft:#FBF0D8;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#12161B; --sheet:#1A2027; --sheet2:#1F262E;
    --ink:#E5E9ED; --ink2:#B7C0CA; --muted:#8D98A5;
    --line:#2E3740; --rule:#4A5866;
    --seal:#FF6F63; --seal-soft:#3A2220;
    --blue:#8DB6D9; --blue-soft:#1E2E3C;
    --mark:#8A7422;
    --ok:#6BD39A; --ok-soft:#173127;
    --warn:#F2BE5C; --warn-soft:#352A12;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#12161B; --sheet:#1A2027; --sheet2:#1F262E;
  --ink:#E5E9ED; --ink2:#B7C0CA; --muted:#8D98A5;
  --line:#2E3740; --rule:#4A5866;
  --seal:#FF6F63; --seal-soft:#3A2220;
  --blue:#8DB6D9; --blue-soft:#1E2E3C;
  --mark:#8A7422;
  --ok:#6BD39A; --ok-soft:#173127;
  --warn:#F2BE5C; --warn-soft:#352A12;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;justify-content:space-between;max-width:960px;margin:0 auto}
.brand h1{font-size:21px;font-weight:900;letter-spacing:-.01em}
.brand h1 .no{color:var(--seal);font-family:var(--mono);font-size:12px;letter-spacing:.08em;margin-right:6px;vertical-align:3px}
.sync{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;max-width:960px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:500;color:var(--ink2);white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:700}
nav.bottom{display:none}
@media (max-width:640px){
  nav.tabs{display:none}
  header.top{padding-bottom:10px}
  nav.bottom{display:grid;grid-template-columns:repeat(8,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:4px 0}
  nav.bottom button svg{width:22px;height:22px}
  nav.bottom button[aria-current="true"]{color:var(--seal);font-weight:700}
}

section.page{padding-top:22px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--seal);text-transform:uppercase}
.lead{color:var(--ink2);max-width:62ch;margin:6px 0 18px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:18px}

/* home */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 20px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:14px 16px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:28px;font-weight:900;line-height:1.2}
.stat .v small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--seal)}
.go{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.go{grid-template-columns:1fr}}
.go button{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.go button:hover{border-color:var(--rule)}
.go b{font-family:var(--serif);font-size:17px}
.go span{font-size:13.5px;color:var(--ink2)}
.topicbars{display:grid;gap:8px;margin-top:6px}
.tb{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:10px;font-size:13.5px}
.tb .bar{margin:0}
.tb .n{text-align:right;color:var(--muted)}

/* map of rights */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
@media (max-width:640px){.map{grid-template-columns:1fr 1fr}}
.map .g{border:1px solid var(--line);border-radius:8px;background:var(--sheet);padding:10px 12px}
.map .g h3{font-size:14.5px;margin-bottom:2px}
.map .g .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.map .g .items{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--sheet2);border-radius:999px;padding:1px 9px;font-size:12.5px}
button.chip:hover{border-color:var(--rule)}
.map .g.money{box-shadow:inset 3px 0 0 var(--seal)}
.map .g.hid{grid-column:1/-1;border-style:dashed}
.legend-money{font-size:12.5px;color:var(--ink2);margin:-8px 0 18px;display:flex;gap:8px;align-items:center}
.legend-money i{width:12px;height:12px;border-radius:2px;background:var(--seal);display:inline-block}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:720px){.cards{grid-template-columns:1fr}}
.card{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:18px}
.card .grp{font-size:11.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.card .def{margin:0;font-weight:500}
.card ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.card ul li{margin:2px 0}
.fate{font-size:13.5px;padding:8px 10px;border-radius:6px;background:var(--blue-soft);color:var(--ink)}
.fate b{color:var(--blue)}
.tip{font-size:13.5px;color:var(--ink2)}
.tip mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 1px}
.cardfoot{display:flex;justify-content:flex-end}
.known{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.known[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}

/* flash */
.flash{padding:28px 22px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.flash .front{font-family:var(--serif);font-size:30px;font-weight:900}
.flash .back{max-width:52ch;margin:0 auto;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--rule)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.btn.seal{background:var(--seal);color:#fff;border-color:var(--seal);font-weight:700}
.btn[disabled]{opacity:.45;cursor:default}

/* quiz */
.qsetup{display:grid;gap:14px}
.qsetup .opts{display:flex;flex-wrap:wrap;gap:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.qbox{padding:20px}
.qtext{font-size:18px;font-weight:700;margin:4px 0 16px;line-height:1.55}
.qtag{display:inline-block;font-size:11.5px;font-family:var(--mono);color:var(--blue);background:var(--blue-soft);padding:1px 8px;border-radius:4px}
.choices{display:grid;gap:8px}
.choices.ox{grid-template-columns:1fr 1fr}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.choice .n{font-family:var(--mono);color:var(--muted);min-width:1.2em}
.choices.ox .choice{justify-content:center;font-family:var(--serif);font-size:30px;font-weight:900;padding:14px}
.choice:not([disabled]):hover{border-color:var(--rule)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--seal);background:var(--seal-soft)}
.choice[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--sheet2);border-left:3px solid var(--blue);font-size:14.5px}
.explain b.ok{color:var(--ok)} .explain b.no{color:var(--seal)}
.qnext{display:flex;justify-content:flex-end;margin-top:14px}
.result{text-align:center;padding:26px}
.sa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sa input{flex:1 1 220px;min-width:0;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--sheet2);color:var(--ink)}
.sa input.right{border-color:var(--ok);background:var(--ok-soft)}
.sa input.wrong{border-color:var(--seal);background:var(--seal-soft)}
.sa .unit{color:var(--muted);font-size:14px}
.result .big{font-family:var(--serif);font-size:44px;font-weight:900}

/* registry drill */
.reg{overflow-x:auto;border:1.5px solid var(--ink);border-radius:2px;background:var(--sheet)}
.reg table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.reg caption{caption-side:top;text-align:left;font-family:var(--serif);font-weight:900;font-size:15px;padding:10px 12px;border-bottom:1.5px solid var(--ink);letter-spacing:.02em}
.reg caption span{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
.reg th{font-size:12px;font-weight:700;color:var(--ink2);background:var(--sheet2);border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;white-space:nowrap}
.reg td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
.reg tr:last-child td{border-bottom:0}
.reg td.num{font-family:var(--mono);color:var(--muted);width:44px;text-align:center}
.reg td.dt{font-family:var(--mono);font-size:13px;white-space:nowrap}
.reg td.dt small{display:block;color:var(--muted);font-size:11.5px}
.reg .purpose b{display:block}
.reg .purpose small{color:var(--muted);font-size:12px}
.gu{font-size:11px;font-family:var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px}
.reg tr.cancel-line td.purpose b{text-decoration:line-through;text-decoration-color:var(--seal);text-decoration-thickness:2px}
.ans{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.rtabs{max-width:100%;flex-wrap:wrap}
@media (max-width:640px){.rtabs{display:flex}.rtabs button{flex:1 1 auto;padding:7px 8px}}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.ccard{display:grid;gap:4px;text-align:left;padding:12px 14px;cursor:pointer;color:var(--ink)}
.ccard:hover{border-color:var(--rule)}
.ctitle{font-weight:700;font-size:15px}
.copts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.copt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 12px;display:grid;gap:4px;color:var(--ink);font:inherit}
.copt:not([disabled]):hover{border-color:var(--rule)}
.copt[disabled]{cursor:default}
.cfb{font-size:13.5px;color:var(--ink2)}
.ckey{margin-top:8px;padding:8px 10px;border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:4px;font-size:14px}
@media (max-width:640px){.cgrid{grid-template-columns:1fr}}
.rlist{display:grid}
.rcap{font-family:var(--serif);font-weight:900;font-size:15px;padding:10px 12px;border-bottom:1.5px solid var(--ink)}
.rcap span{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
.rcard{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.rcard:last-child{border-bottom:0}
.rcard.rbase{background:var(--blue-soft)}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.rdate{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.rdate small{color:var(--muted)}
.ramt{margin-left:auto;font-weight:700;white-space:nowrap}
.rctrl:empty{display:none}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rgrid label{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.rin{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sheet2);color:var(--ink);min-width:0}
.redit{display:grid;gap:6px}
.rrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.rrow label{display:flex;align-items:center;gap:4px}
@media (max-width:640px){.rgrid{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:5px 10px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.basis{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:5px 9px;font-size:13px;white-space:nowrap}
.basis[aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal);font-weight:700}
@media (max-width:640px){
  .reg table{min-width:0}
  .reg thead{display:none}
  .reg tr{display:grid;grid-template-columns:30px 1fr;column-gap:8px;padding:10px 8px;border-bottom:1px solid var(--line)}
  .reg tr:last-child{border-bottom:0}
  .reg td{border:0;padding:2px 0}
  .reg td.num{grid-row:1/5;text-align:left;width:auto;padding-top:3px}
  .reg td.who{font-size:13px;color:var(--muted)}
  .reg td.act{padding-top:8px}
}
.stamp{display:inline-block;font-family:var(--serif);font-weight:900;font-size:13px;padding:1px 7px;border:2px solid currentColor;border-radius:4px;transform:rotate(-6deg);letter-spacing:.1em}
.stamp.gone{color:var(--muted)} .stamp.keep{color:var(--seal)} .stamp.base{color:var(--blue)}
.fb{font-size:13px;margin-top:4px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--seal)}
.tenant{margin-top:14px;padding:14px 16px;display:grid;gap:8px}
.tenant .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.tenant .facts span b{font-family:var(--mono);font-weight:500}
.drillbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.steps div{font-size:13.5px;padding:10px 12px;border:1px dashed var(--rule);border-radius:8px;color:var(--ink2)}
.steps b{font-family:var(--mono);color:var(--seal);margin-right:4px}
.score{padding:14px 16px;margin-top:14px;display:grid;gap:8px}
.score h3{font-size:17px}
.score ul{margin:0;padding-left:18px;font-size:14.5px}
.score li{margin:3px 0}

/* calculators */
.calcs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.calcs{grid-template-columns:1fr}}
.calc{padding:18px;display:grid;gap:12px;align-content:start}
.calc h2{font-size:19px}
.f{display:grid;gap:4px}
.f label{font-size:13px;font-weight:700;color:var(--ink2)}
.f input,.f select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sheet2);color:var(--ink);width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{border-radius:8px;padding:12px 14px;background:var(--sheet2);border:1px solid var(--line);display:grid;gap:4px}
.out .big{font-family:var(--serif);font-size:22px;font-weight:900}
.out.ok{background:var(--ok-soft);border-color:transparent}
.out.no{background:var(--seal-soft);border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-family:var(--mono);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.timeline{display:flex;gap:0;margin-top:4px;font-size:12.5px}
.timeline div{flex:1;border-top:3px solid var(--rule);padding-top:6px;padding-right:6px}
.timeline div.hot{border-top-color:var(--seal)}
.timeline b{display:block;font-family:var(--mono);font-size:12.5px}

/* cycle */
.cycle{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.cycle li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cycle li:last-child{border-bottom:0}
.cycle .no{font-family:var(--mono);font-size:22px;color:var(--seal);line-height:1.2}
.cycle h3{font-size:17px;margin-bottom:2px}
.cycle p{margin:0;color:var(--ink2);font-size:14.5px}
.check{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:640px){.check{grid-template-columns:1fr}}
.check fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;background:var(--sheet)}
.check legend{font-weight:700;font-size:13.5px;padding:0 4px}
.check label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0}
.check input{margin-top:5px;accent-color:var(--seal)}
.check small{display:block;color:var(--muted);font-size:12.5px}
.sites{overflow-x:auto}
.sites table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.sites th,.sites td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.sites th{font-size:12.5px;color:var(--ink2);background:var(--sheet2)}
pre.tpl{white-space:pre-wrap;font-family:var(--sans);font-size:14px;background:var(--sheet2);border:1px dashed var(--rule);border-radius:8px;padding:12px 14px;margin:0}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 10px}
.h2row h2{font-size:20px}
/* 문제집 */
.qtabs{margin-bottom:14px}
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.unit-no{font-size:22px;color:var(--seal)}
.unit-body{display:grid;gap:3px}
.unit-body b{font-family:var(--serif);font-size:16.5px}
.unit-body .bar{margin-top:4px}
.unit-act{display:flex;gap:6px}

  fate:"지금은 법이 낙찰자 편이다. <b>강제집행 절차를 기본으로 깔고</b> 그 위에서 협의한다.",tip:"'되도록 협의하고 강제집행은 최후 수단'은 <mark>옛날 얘기</mark>. 협의가 잘 돼도 계고까지는 절차를 진행해 둔다."},
 {id:"md2",g:"md",name:"강제집행 흐름",def:"낙찰 → 매각허가결정(7일) → 확정(7일) → 잔금(30일 이내) → 인도명령 신청 → 결정문 송달 → 강제집행 신청 → 개문 계고 → 강제집행.",
  pts:["인도명령은 잔금을 내는 날 같이 신청한다","결정문이 송달 안 되면: 재송달 → 주소보정 → 특별송달 → 공시송달·발송송달","집행 후 짐(유체동산)은 보관 → 유체동산 경매 신청 → 낙찰 후 폐기","대법원 경매사이트 '나의 사건 검색'에서 인도명령 사건번호(예: 2026타인12345)로 송달 여부 확인"],
  fate:"절차법이라 단계마다 시간이 걸린다. 미리 신청해 둘수록 이사 날짜가 당겨진다.",tip:"낙찰받은 날: 대출 상담, 경매계에 열람 가능일 확인(<mark>진짜 목적은 점유자 연락처</mark>), 현관에 연락처 포스트잇."},
 {id:"md3",g:"md",name:"명도 협상 순서",def:"포지션을 먼저 잡고, 이사 날짜를 확정한 뒤, 마지막에 이사비를 정한다.",
  pts:["잔금 치르는 날 내용증명 + 일반우편을 같이 보낸다","이사 날짜 기준: 소유자는 20일 정도, 임차인은 배당기일 후 1주일 이내","이사비 기준은 낙찰자가 먼저 낮게 제시한다(앵커링)","법률·논리·상식으로 설득하려 애쓰지 않는다. 계고까지 가도 안 움직이면 원래 나갈 생각이 없던 것"],
  fate:"이사 날짜 전에 이사비 얘기 금지. 이사 전 이사비 일부라도 먼저 주지 않는다.",tip:"'이사비 얼마 원하세요?'라고 물으면 <mark>항상 생각보다 큰 금액</mark>이 돌아온다."},
 {id:"md4",g:"md",name:"명도 10계명",def:"명도에서 반드시 지킬 원칙들.",
  pts:["모든 통화·문자를 녹음하고 지우지 않는다","자존심 상하는 말 금지, 할 이야기만 정중하게","첫 주제는 언제나 이사 날짜","이사한다고 하면 새 계약서 사진을 요청","이사 전에는 명도확인서도 이사비 일부도 주지 않는다","이사 당일 이사비 주기 전 유체동산포기각서(문자도 가능) 받기","배당 문의는 경매계로 안내","협의 이사면 20~30만원 정도 더 보태면 마무리가 좋다","협상력이 부족하면 가상의 결정권자를 둔다"],
  fate:"감정 싸움이 아니라 순서 싸움이다.",tip:"'저도 못 믿어서 미리 달라는 게 아니냐, <mark>서로 깔끔하게 동시이행</mark> 하자'가 잘 먹히는 멘트."},
 {id:"md5",g:"md",name:"미납관리비·공과금",def:"낙찰자가 떠안는 범위와 처리 방법.",

  fate:"이사비 주기 전에 공과금 정산부터 확인.",tip:"관리사무소엔 <mark>'공용부분만 내겠다'</mark>고 먼저 말한다."},
 {id:"md6",g:"md",name:"재계약·연락 두절",def:"점유자가 계속 살고 싶어 하거나 연락이 안 될 때.",
  pts:["전 소유자와는 재계약하지 않는다(이미 빚으로 경매된 사람)","임차인과 재계약하면 인도명령 신청이 거부된다","재계약한다면 보증금은 하루에 다 받고, 인도명령 절차는 계속 진행","연락처 찾기: 관리사무소, 주차된 차량, 세탁소·도시가스, 경매계 등사열람(이해관계인 자격)"],

 {id:"bae1",g:"bae",name:"배당 순위",def:"낙찰대금을 나눠 주는 순서. 앞 순위가 다 받아야 다음으로 넘어간다.",
  pts:["0순위 경매비용","1순위 유익비·필요비","2순위 최우선변제: 소액임차인, 임금채권(최종 3개월 월급·3년 퇴직금)","3순위 당해세","4순위부터: (근)저당·담보가등기·배당요구한 전세권은 접수일, 확정일자 임차인은 대항력+확정일자 갖춘 날, 일반조세는 법정기일 순서로 우선배당","가압류는 순서가 아니라 금액 비율로 나누는 안분배당"],

 {id:"bae2",g:"bae",name:"선순위 임차인 함정",def:"배당을 다 받을 것처럼 보이는데 실제로는 낙찰자가 보증금을 떠안는 경우들.",
  pts:["토지·건물 말소기준이 다르거나 토지별도등기: 대금이 감정비율로 나뉘어 건물 배당이 줄어든다(선·후 구분은 건물 말소기준)","임차인보다 먼저 받는 세금(당해세·법정기일 빠른 세금)이나 임금채권(근로복지공단)","확정일자가 말소기준 근저당보다 늦음","배당요구 안 함, 종기일 뒤 배당요구, 권리신고만, 확정일자 없음, 배당요구 철회 → 전액 인수","예전 경매에서 확정일자 우선변제권을 이미 씀(한 번뿐)","전세권+임차권을 둘 다 가진 임차인: 어느 권리로 신청했는지에 따라 인수액이 달라짐","세대합가: 세대원의 최초 전입일로 대항력 판단"],
  fate:"압류·교부청구 세금, 문건접수내역, 배당요구 여부를 꼭 확인.",tip:"의외로 <mark>확정일자가 늦은 선순위 임차인</mark>에게 많이 걸린다."},
 {id:"bae3",g:"bae",name:"가짜 같은 진짜 임차인·무상임대차각서",def:"대출이 많이 나온 물건의 선순위 전입자를 무조건 가짜로 보면 안 된다.",
  pts:["은행이 대출 사고를 내는 경우가 있다","채무자가 법인이면 은행이 임차인 여부를 따지지 않고 대출하기도 한다","공동담보면 근저당 금액이 커 보일 뿐","무상임대차각서: 낙찰자가 각서를 받은 은행이면 임차인이 권리 주장 못 함","제3자 낙찰자에겐, 임차인이 권리신고를 안 했고 은행이 각서를 법원에 냈을 때만 대항력 주장 못 함"],

 {id:"st1",g:"strat",name:"투자 3방향과 종잣돈",def:"싸게 사기(현재가치), 쌀 때 사기(미래가치), 파이프라인(현금흐름).",
  pts:["플피투자: 전세가보다 싸게 낙찰 → 인테리어 → 전세 맞추기로 돈이 남게","단타: 입지(일자리·역세권 도보 10분·학교·대단지 인근)인데 허들 있는 물건(방3 빌라, 나홀로, 1층, 서울 외) → 수리 후 매도","공시가 1억 미만 주택(강의 시점): 취득세 1.1%, 취득 시 주택 수 미합산. 단 종부세·양도세엔 포함, 정비구역은 혜택 없음","오피스텔을 단기 매도하면 건물분 부가세 10%"],

 {id:"st2",g:"strat",name:"권리상 허들 물건 5가지",def:"권리가 무서워 보여 경쟁이 적지만 풀 수 있는 물건들.",

 {id:"st3",g:"strat",name:"상가 시세 = 월세×환산값+보증금",def:"그 동네 적정 수익률로 환산값을 정해 월세만 보고 시세를 빠르게 판단한다.",

 {id:"m1",t:"md",k:"mc",q:"인도명령 → 결정문 → 강제집행으로 가면 보통 얼마나 걸릴까요?",o:["2주","2~3개월","6개월~1년 이상","2년"],a:1,e:"명도소송은 판결문까지 6개월~1년 이상 걸린다."},

 {id:"m3",t:"md",k:"sa",q:"2002년 7월 1일 시행돼 인도명령 대상을 크게 넓힌 법은?",ans:["민사집행법"],show:"민사집행법",e:"그 전 민사소송법 시절엔 명도소송 대상이 많았다."},
 {id:"m4",t:"md",k:"ox",q:"요즘도 협의가 기본이고, 강제집행 절차는 협의가 실패했을 때만 시작한다.",a:1,e:"강제집행 절차를 기본으로 깔고 그 위에서 협의한다. 협의가 실패한 뒤 시작하면 몇 달이 날아간다."},
 {id:"m5",t:"md",k:"ox",q:"협의가 잘 진행되더라도 계고 단계까지는 절차를 진행해 둔다.",a:0,e:"절차법이라 단계마다 시간이 걸린다. 압박 수단이자 보험이다."},

 {id:"m7",t:"md",k:"sa",q:"점유자가 임차인이면 인도명령 결정은 보통 언제쯤 날까요?",ans:["배당기일"],show:"배당기일",e:"소유자면 2~3일."},
 {id:"m8",t:"md",k:"mc",q:"매각기일 후 매각허가결정까지 걸리는 기간은?",o:["3일","7일","14일","30일"],a:1,e:"허가결정 7일, 확정 7일, 그 뒤 30일 안에 잔금."},
 {id:"m9",t:"md",k:"mc",q:"인도명령 결정문이 점유자에게 송달되지 않을 때 쓰는 방법이 아닌 것은?",o:["재송달","특별송달","공시송달","개문 계고"],a:3,e:"개문 계고는 강제집행 단계의 예고다. 송달은 재송달 → 주소보정 → 특별송달 → 공시송달·발송송달."},
 {id:"m10",t:"md",k:"mc",q:"강제집행 절차 순서로 맞는 것은?",o:["강제집행 신청 → 개문 계고 → 강제집행 → 유체동산 보관","개문 계고 → 강제집행 신청 → 유체동산 보관 → 강제집행","강제집행 → 강제집행 신청 → 개문 계고 → 보관","인도명령 신청 → 강제집행 → 결정문 송달 → 계고"],a:0,e:"집행 후 짐은 보관했다가 유체동산 경매 신청 → 낙찰 후 폐기."},
 {id:"m11",t:"md",k:"sa",q:"강제집행 때 집 안의 짐(가구·물건)을 법적으로 부르는 말은?",ans:["유체동산"],show:"유체동산",e:"보관 후 유체동산 경매로 정리한다."},

 {id:"m13",t:"md",k:"ox",q:"낙찰 후 경매계에 기록 열람을 하는 실제 목적은 점유자 연락처를 알아내는 것이다.",a:0,e:"열람 사유는 '전반적 자료 확인'이라고 말하면 된다."},
 {id:"m14",t:"md",k:"sa",q:"낙찰자는 어떤 자격으로 경매 사건 기록을 열람(등사열람)할 수 있을까요?",ans:["이해관계인"],show:"이해관계인",e:"연락이 끊긴 점유자 연락처를 찾을 때도 쓴다."},

 {id:"m16",t:"md",k:"ox",q:"이사비 금액을 먼저 정해 두면 이사 날짜 협상이 쉬워진다.",a:1,e:"순서가 반대. 이사 날짜를 먼저 확정하고 이사비는 협조 정도에 따라 낙찰자가 정한다."},
 {id:"m17",t:"md",k:"mc",q:"점유자가 전 소유자일 때 이사 기한으로 제시하는 기준은?",o:["20일 정도","배당기일 후 1주일","3개월","6개월"],a:0,e:"임차인은 배당기일 이후 1주일 이내가 기준."},
 {id:"m18",t:"md",k:"mc",q:"점유자가 임차인일 때 이사 기한 기준은?",o:["낙찰 다음 날","배당기일 이후 1주일 이내","잔금 납부일","6개월 후"],a:1,e:"보증금을 배당받는 날에 맞춘다."},

 {id:"m20",t:"md",k:"ox",q:"이사 나가기 전에 이사비 일부를 먼저 주면 협상이 부드러워진다.",a:1,e:"이사 전엔 이사비 일부도, 명도확인서도 주지 않는다."},

 {id:"m22",t:"md",k:"mc",q:"명도 원칙으로 맞지 않는 것은?",o:["모든 통화·문자 녹음하고 보관","이사한다면 새 계약서 사진 요청","배당 문의는 경매계로 안내","점유자 사정을 충분히 듣고 이사비로 위로"],a:3,e:"사정 이야기는 '이사 날짜부터 정해 달라'로 끊는다."},

 {id:"t7",t:"strat",k:"mc",q:"'권리상 허들' 투자 대상이 아닌 것은?",o:["배당을 다 받는 선순위 임차인","소멸하는 선순위 전세권","HUG 대항력포기 물건","말소기준보다 앞선 보전가등기"],a:3,e:"선순위 보전가등기는 소유권을 뺏길 수 있는 진짜 위험이다."},
 {id:"t8",t:"strat",k:"ox",q:"선순위 전세권이 배당요구한 물건은 임차권(전입)까지 같이 있어야 안전하다.",a:1,e:"임차권이 있으면 보증금 인수 가능성이 생긴다. 없어야 한다."},
 {id:"t9",t:"strat",k:"mc",q:"HUG 대항력포기 물건에서 꼭 확인할 것은?",o:["매각물건명세서의 대항력포기·임차권등기말소 동의서","건축물대장 층수","토지이용계획","관리비"],a:0,e:"조건부 대항력 포기도 있으니 문구를 읽고, 현장에서 공실인지도 본다."},
 {id:"t10",t:"strat",k:"mc",q:"재매각 물건의 입찰보증금은 보통 최저가의?",o:["5%","10%","20~30%","50%"],a:2,e:"전 낙찰자가 잔금을 안 낸 물건. 너무 비싸게 낙찰됐던 건지 시세부터 본다."},
 {id:"t11",t:"strat",k:"mc",q:"강의 기준 아파트와 상가의 연 임대수익률은?",o:["아파트 3~4%, 상가 5~6%","아파트 6%, 상가 3%","둘 다 10%","아파트 1%, 상가 2%"],a:0,e:"상가는 대출도 70~80%(법인 90%)까지 나오는 편."},
 {id:"t12",t:"strat",k:"mc",q:"대출이 안 나오는 상가는?",o:["1층 상가","벽체 없는 상가","단지 내 상가","근린상가"],a:1,e:"구분이 안 되는 오픈형은 담보로 잡기 어렵다."},
 {id:"t13",t:"strat",k:"mc",q:"2층 상가 임대료는 보통 1층의 얼마쯤?",o:["같다","절반","30~40%","두 배"],a:1,e:"3층 이상은 1층의 30~40%."},
 {id:"t14",t:"strat",k:"mc",q:"상가 보증금은 보통 월세의?",o:["2~3배","10~20배","50배","100배"],a:1,e:"월세 200만 → 보증금 2천~4천."},
 {id:"t15",t:"strat",k:"mc",q:"상가 전용면적은 분양면적의 대략?",o:["90%","50~60%","20%","100%"],a:1,e:"분양 40평이면 전용 20평 정도."},
 {id:"t16",t:"strat",k:"ox",q:"상가 평당 관리비는 전용면적 기준으로 매긴다.",a:1,e:"관리비는 분양면적, 월세는 전용면적 기준."},
 {id:"t17",t:"strat",k:"mc",q:"상가의 적정 임차료는 한 달 매출의?",o:["1%","10%","30%","50%"],a:1,e:"5영업일 매출 정도. 상권정보 사이트로 일 매출을 가늠한다."},
 {id:"t18",t:"strat",k:"sa",q:"적정 수익률이 6%인 지역의 상가 환산값은? (숫자)",ans:["200"],show:"200",e:"환산값 = 12 ÷ 수익률. 6% → 200."},
 {id:"t19",t:"strat",k:"sa",q:"적정 수익률이 5%면 환산값은? (숫자)",ans:["240"],show:"240",e:"12 ÷ 0.05 = 240."},
 {id:"t20",t:"strat",k:"sa",q:"적정 수익률이 4%면 환산값은? (숫자)",ans:["300"],show:"300",e:"12 ÷ 0.04 = 300."},
 {id:"t21",t:"strat",k:"mc",q:"월세로 상가 시세를 보는 공식은?",o:["월세 × 환산값 + 보증금","월세 × 12","보증금 × 10","(월세 + 보증금) × 2"],a:0,e:"6% 지역, 1000/50이면 50×200+1000 = 1억1천."},
 {id:"t22",t:"strat",k:"ox",q:"현 임차인 월세가 주변 시세보다 낮으면, 매물이 비싸 보여도 실제 가치는 더 높을 수 있다.",a:0,e:"임대료는 올리면 된다. 주변 비슷한 상가 월세로 다시 계산해 본다."},
 {id:"t23",t:"strat",k:"ox",q:"아파트도 자장면처럼 가격이 오르거나 보합만 한다.",a:1,e:"투자자산이라 하락 구간이 있다. 필수재이자 투자재이자 투기재."},
 {id:"t24",t:"strat",k:"mc",q:"아파트가 가진 세 가지 성격은?",o:["필수재·투자재·투기재","사치재·필수재·공공재","소비재·자본재·공공재","필수재만"],a:0,e:"투기 성격이 거품 구간을 만들어 상승·하락 사이클이 생긴다."},
 {id:"t25",t:"strat",k:"ox",q:"매수심리 지도(시그널 투자맵)는 세부 동네의 매수심리까지 정확히 보여준다.",a:1,e:"큰 흐름은 잘 보이지만 세부 지역은 못 보여주고, 호가 기준이라 시차가 있다."},
 {id:"t26",t:"strat",k:"mc",q:"고시원 투자에서 노리는 물건은?",o:["입지 좋은데 운영을 못 하는 고시원","신축 고시원","역에서 먼 고시원","만실 고시원"],a:0,e:"지도 등록·홈페이지 같은 마케팅만 해도 살아나는 곳."},

 /* ---- 배당·선순위 ---- */
 {id:"b1",t:"bae",k:"mc",q:"배당에서 가장 먼저(0순위) 나가는 돈은?",o:["경매비용","당해세","근저당","소액임차인"],a:0,e:"0 경매비용 → 1 유익비·필요비 → 2 최우선변제 → 3 당해세 → 4 이후 날짜 순."},
 {id:"b2",t:"bae",k:"mc",q:"배당 1순위는?",o:["유익비·필요비","당해세","가압류","확정일자 임차인"],a:0,e:"집의 가치를 지키거나 높이려 쓴 비용."},
 {id:"b3",t:"bae",k:"mc",q:"2순위 최우선변제에 들어가는 것은?",o:["소액임차인·임금채권(최종 3개월 월급, 3년 퇴직금)","근저당","가압류","일반조세"],a:0,e:"이 둘은 등기 순서와 상관없이 먼저 받는다."},
 {id:"b4",t:"bae",k:"sa",q:"배당 3순위 세금은?",ans:["당해세"],show:"당해세",e:"그 부동산 자체에 매겨진 세금."},
 {id:"b5",t:"bae",k:"mc",q:"가압류는 배당을 어떻게 받을까요?",o:["접수일 순서대로 우선배당","금액 비율로 나누는 안분배당","항상 0원","가장 먼저"],a:1,e:"뒤에 오는 채권들과 금액 비율대로 나눠 가진다."},
 {id:"b6",t:"bae",k:"mc",q:"확정일자 받은 임차인의 배당 순위를 정하는 날짜는?",o:["계약일","전입일","대항력과 확정일자를 모두 갖춘 날","잔금일"],a:2,e:"둘 중 늦은 날이 기준이 된다."},
 {id:"b7",t:"bae",k:"mc",q:"일반조세의 배당 순위 기준은?",o:["법정기일(또는 과세기준일)","등기 접수일","납부기한","체납 금액"],a:0,e:"법정기일이 임차인·근저당보다 빠르면 먼저 받아 간다."},
 {id:"b8",t:"bae",k:"ox",q:"선순위 임차인이 확정일자 없이 배당요구하면 우선변제로 배당받는다.",a:1,e:"확정일자가 없으면 우선변제권이 없다. 보증금을 낙찰자가 떠안는다."},
 {id:"b9",t:"bae",k:"ox",q:"선순위 임차인이 배당요구 종기일이 지난 뒤 배당요구하면 보증금을 낙찰자가 전부 떠안는다.",a:0,e:"종기일까지 배당요구해야 배당에 참여할 수 있다."},
 {id:"b10",t:"bae",k:"mc",q:"선순위 임차인 보증금을 낙찰자가 전액 떠안게 되는 경우가 아닌 것은?",o:["배당요구를 안 함","권리신고만 하고 배당요구는 안 함","배당요구를 철회함","종기일 전에 확정일자를 갖추고 배당요구함"],a:3,e:"마지막은 정상적으로 배당받는 경우."},
 {id:"b11",t:"bae",k:"ox",q:"확정일자로 생긴 우선변제권은 한 번 쓰면 다음 경매에서 다시 쓸 수 없다.",a:0,e:"예전 경매에서 배당요구했으면, 다시 경매가 나와도 우선변제로 배당받지 못해 인수될 수 있다."},
 {id:"b12",t:"bae",k:"ox",q:"대항력이 앞선 선순위 임차인이라도, 확정일자가 말소기준 근저당보다 늦으면 배당이 밀려 인수가 생길 수 있다.",a:0,e:"의외로 이 함정에 많이 걸린다."},
 {id:"b13",t:"bae",k:"mc",q:"토지와 건물의 말소기준이 다를 때 선·후순위 임차인을 가르는 기준은?",o:["건물 말소기준권리","토지 말소기준권리","전입일","감정가"],a:0,e:"대금은 토지·건물 감정비율로 나뉘어, 건물 배당이 줄 수 있다."},
 {id:"b14",t:"bae",k:"ox",q:"토지별도등기 물건은 낙찰대금이 감정비율로 나뉘어 건물 배당이 줄 수 있다.",a:0,e:"임차인은 건물 쪽 대금에서 받으니, 그만큼 인수가 생길 수 있다."},
 {id:"b15",t:"bae",k:"mc",q:"선순위 임차인보다 먼저 받아 가서 인수를 만드는 것은?",o:["당해세·법정기일 빠른 세금·임금채권","후순위 가압류","지상권","유치권"],a:0,e:"등기부 압류, 교부청구, 문건접수내역을 확인."},
 {id:"b16",t:"bae",k:"sa",q:"임금채권 때문에 경매를 넣거나 가압류하는 일이 많은 공공기관은?",ans:["근로복지공단"],show:"근로복지공단",e:"문건접수내역에 권리신고·배당요구가 있는지 본다."},
 {id:"b17",t:"bae",k:"mc",q:"세대합가한 임차인의 대항력은 누구의 전입일로 판단할까요?",o:["세대주의 최근 전입일","세대원의 최초 전입일","계약자의 확정일자","가장 늦은 전입일"],a:1,e:"그래서 후순위처럼 보이는 선순위 임차인이 생긴다."},
 {id:"b18",t:"bae",k:"ox",q:"전세권 등기와 전입신고를 같이 한 임차인은, 어느 권리로 경매신청·배당요구했는지에 따라 인수 금액이 달라질 수 있다.",a:0,e:"전세권(민법)과 임차권(주택임대차보호법) 두 개를 가진 셈."},
 {id:"b19",t:"bae",k:"ox",q:"근저당 금액이 크면 선순위 전입자는 가짜 임차인이라고 봐도 된다.",a:1,e:"은행 사고, 법인 대출, 공동담보 때문에 커 보일 수 있다."},
 {id:"b20",t:"bae",k:"mc",q:"은행에 무상임대차각서를 써 준 임차인이 있는 물건을 그 은행이 낙찰받으면?",o:["임차인이 권리를 주장할 수 없다","임차인이 보증금 전액을 받는다","경매가 취소된다","대항력이 생긴다"],a:0,e:"제3자 낙찰자에겐 경우가 다르다."},
 {id:"b21",t:"bae",k:"mc",q:"제3자 낙찰자에게 임차인이 대항력을 주장하지 못하는 경우는?",o:["임차인이 권리신고를 안 했고, 은행이 각서를 법원에 냈다","임차인이 권리신고를 했고 각서도 냈다","둘 다 안 했다","임차인이 권리신고만 했다"],a:0,e:"나머지 경우는 대항력 주장이 가능하다."},
 {id:"b22",t:"bae",k:"sa",q:"소액임차인 판단 기준이 될 담보물권이 없으면 어느 날을 기준으로 할까요?",ans:["배당기일"],show:"배당기일",e:"보통은 최선순위 담보물권 설정일이 기준이다."},

 {id:"j1",t:"jb",k:"mc",q:"지분투자의 단점으로 맞는 것은?",o:["대출이 안 나오고, 공유자우선매수로 뺏길 수 있다","경쟁률이 높다","큰돈이 든다","수익까지 몇 년 걸린다"],a:0,e:"장점: 경쟁 적고 싸다, 100만원 이하도 가능, 2~5개월에 90%가 끝난다."},
 {id:"j2",t:"jb",k:"sa",q:"다른 공유자가 같은 값에 먼저 사겠다고 나설 수 있는 권리는?",ans:["공유자우선매수"],show:"공유자우선매수(청구)권",e:"공매는 매각결정 전까지 신고할 수 있다."},
 {id:"j3",t:"jb",k:"mc",q:"온비드 공매 입찰 기간은 보통?",o:["월 10시 ~ 수 17시","금 9시 ~ 일 18시","매일 24시간","화 14시 하루"],a:0,e:"목 11시쯤 결과 발표, 다음 주 월 10시 매각결정."},
 {id:"j4",t:"jb",k:"ox",q:"공매에서 공유자우선매수신고는 매각결정 전까지 할 수 있다.",a:0,e:"그래서 낙찰받고도 매각결정 전에 뺏길 수 있다."},
 {id:"j5",t:"jb",k:"mc",q:"수익화 1번 '치고 빠지기'는?",o:["잔금 전 공유자와 협의해 보증금+수익을 받고 잔금 포기","잔금 후 바로 소송","전체를 경매 신청","10년 보유"],a:0,e:"가장 빠른 방법."},
 {id:"j6",t:"jb",k:"sa",q:"공유물 전체를 경매에 부쳐 지분대로 나눠 받게 하는 소송은?",ans:["공유물분할"],show:"공유물분할(청구)소송",e:"민법 제268조가 근거."},
 {id:"j7",t:"jb",k:"mc",q:"다른 공유자가 혼자 살고 있을 때 내 지분만큼 월세 상당액을 청구하는 소송은?",o:["부당이득금반환소송","명도소송","공유물분할소송","배당이의소송"],a:0,e:"판결문으로 상대 지분을 경매에 넣고 공유자우선매수로 가져올 수도 있다."},
 {id:"j8",t:"jb",k:"ox",q:"주거용 지분은 임차인이 살고 있는 물건이 좋다.",a:1,e:"다른 공유자가 직접 사는 물건이 좋다. 임차인 있는 물건은 제외."},

/* 계산 문제 생성기 — 매번 새 숫자 */
const CONV = {4:300,5:240,6:200,7:170,8:150,9:130,10:120};
const r100 = v => Math.round(v/100)*100;
const man = v => `${Math.round(v).toLocaleString()}만원`;
function genItem(kind){
  if(GEN_EXTRA[kind]) return GEN_EXTRA[kind]();
  if(kind==="insu" || kind==="total"){
    const L = r100(rnd(100,300)*100);
    const C = rnd(15,30)*10;
    const byTax = Math.random()<0.5;
    const T = r100(L * rnd(20,55)/100);
    const rest = L - C - T;
    let D = r100(rest + rnd(10,60)*100);
    const pay = Math.min(D, rest), insu = D - pay;
    const who = byTax ? `임차인보다 먼저 받는 세금(당해세)` : `임차인보다 먼저 받는 최우선 임금채권`;
    const base = `낙찰가 ${man(L)}, 경매비용 ${man(C)}, ${who} ${man(T)}. 선순위 임차인(대항력·확정일자 모두 말소기준보다 빠르고 배당요구함)의 보증금 ${man(D)}.`;
    const how = `배당: 경매비용 ${man(C)} + ${byTax?"세금":"임금채권"} ${man(T)}가 먼저 → 임차인은 남은 ${man(pay)}만 받는다. 인수 = ${man(D)} − ${man(pay)} = ${man(insu)}.`;
    if(kind==="insu") return {q:base+" 낙찰자가 떠안는 보증금은? (만원)", num:insu, tol:0, unit:"만원", e:how};
    return {q:base+" 낙찰자가 실제로 들이는 총 금액(낙찰가 + 인수금)은? (만원)", num:L+insu, tol:0, unit:"만원", e:how+` 총 = ${man(L)} + ${man(insu)} = ${man(L+insu)}.`};
  }
  if(kind==="shop"){
    const r = pick([4,5,6,7,8,10]);
    const M = rnd(5,30)*10;
    const B = r100(M * rnd(10,20));
    const v = M*CONV[r] + B;
    return {q:`이 동네 상가 적정 수익률은 ${r}%입니다. 보증금 ${man(B)} / 월세 ${man(M)}인 상가의 시세는? (만원)`, num:v, tol:0, unit:"만원", e:`${r}% 환산값은 ${CONV[r]}. 시세 = 월세 × 환산값 + 보증금 = ${M} × ${CONV[r]} + ${B.toLocaleString()} = ${man(v)}.`};
  }
  const P = rnd(20,80)*500, M = rnd(5,40)*10;
  const B = r100(M * rnd(10,20));
  const rate = Math.round(M*12/(P-B)*1000)/10;
  return {q:`매매가 ${man(P)}, 보증금 ${man(B)}, 월세 ${man(M)}인 상가의 연 수익률은? (%, 소수 첫째 자리)`, num:rate, tol:0.15, unit:"%", e:`수익률 = 월세×12 ÷ (매매가 − 보증금) = ${(M*12).toLocaleString()} ÷ ${(P-B).toLocaleString()} × 100 ≈ ${rate}%.`};
}

/* 자동 출제 추가 종류 */
const GEN_KIND_POOL = [
  ["근저당권설정",true],["가압류",true],["압류(세무서)",true],["담보가등기",true],
  ["보전가등기(소유권이전청구권)",false],["가처분(소유권이전금지)",false],["지상권설정",false],["전세권(배당요구 안 함)",false],["주택임차권등기",false]
];
function randDates(n){ let d = new Date(2015+rnd(0,7), rnd(0,11), rnd(1,28)); const out=[]; for(let i=0;i<n;i++){ d = addDays(d, rnd(15,300)); out.push(new Date(d)); } return out; }
const GEN_EXTRA = {
  daehang(){
    const base = new Date(2018+rnd(0,6), rnd(0,11), rnd(1,28));
    const off = pick([-90,-20,-2,-1,0,1,15]);
    const mv = addDays(base, off), has = mv < base;
    return {q:`임차인 전입(점유 중) ${fmt(mv)}, 말소기준 근저당 접수 ${fmt(base)}. 이 임차인은 낙찰자에게 대항력이 있다.`, a: has?0:1,
      e:`대항력은 전입 다음 날인 ${fmt(addDays(mv,1))} 0시에 생긴다. ${has ? "근저당보다 먼저라 대항력이 있다." : (off===0 ? "같은 날 접수된 근저당이 앞선다." : "근저당보다 늦어 대항력이 없다.")}`};
  },
  base(){
    const picks = shuffle(GEN_KIND_POOL).slice(0,4);
    if(!picks.some(p=>p[1])) picks[rnd(0,3)] = GEN_KIND_POOL[rnd(0,3)];
    const ds = randDates(4);
    const rows = picks.map((p,i)=>({label:`${fmt(ds[i])} ${p[0]}`, cand:p[1]}));
    const ans = rows.findIndex(r=>r.cand);
    return {q:"다음 권리 중 말소기준권리는? (날짜가 빠른 순으로 적혀 있지 않을 수 있어요 — 보기 순서가 섞입니다)", o:rows.map(r=>r.label), a:ans,
      e:`돈이 목적인 권리(근저당·가압류·압류·담보가등기) 중 가장 빠른 것: ${rows[ans].label}. 보전가등기·가처분·지상권·전세권·임차권등기는 후보가 아니다.`};
  },
  fate(){
    const cands = GEN_KIND_POOL.filter(p=>p[1]), non = GEN_KIND_POOL.filter(p=>!p[1]);
    const before = Math.random()<0.5;
    const b = pick(cands), x = before ? pick(non) : pick(non.concat(cands));
    const [d1,d2] = randDates(2);
    const bd = before ? d2 : d1, xd = before ? d1 : d2;
    const keep = before && !x[1];
    return {q:`말소기준권리: ${fmt(bd)} ${b[0]}. 그런데 ${fmt(xd)}에 ${x[0]}이(가) 있습니다. 이 권리는 낙찰 후 인수된다.`, a: keep?0:1,
      e: keep ? "말소기준보다 앞선, 돈이 목적이 아닌 권리라 인수된다." : (x[1] ? "돈이 목적인 권리는 배당받고 소멸한다." : "말소기준보다 뒤라 소멸한다.")};
  },
  loan(){
    const A = rnd(15,60)*1000, bidRate = rnd(55,95)/100, B = r100(A*bidRate);
    const v = Math.min(A*0.7, B*0.8);
    return {q:`비주거용 상가, 감정가 ${man(A)} · 낙찰가 ${man(B)}. 경락대출 한도 기본 기준으로 계산하면? (만원)`, num:Math.round(v), tol:1, unit:"만원",
      e:`감정가 70% = ${man(A*0.7)}, 낙찰가 80% = ${man(B*0.8)} → 둘 중 낮은 ${man(v)}.`};
  },
  loanres(){
    const K = rnd(15,50)*1000, L = pick([40,50,60,70]), B = r100(K*rnd(70,100)/100);
    const v = Math.min(K*L/100, B*0.8);
    return {q:`주거용 빌라, KB시세 ${man(K)} · LTV ${L}% · 낙찰가 ${man(B)}. DSR은 신경 쓰지 않을 때 대출 한도는? (만원)`, num:Math.round(v), tol:1, unit:"만원",
      e:`KB시세×LTV = ${man(K*L/100)}, 낙찰가 80% = ${man(B*0.8)} → 낮은 쪽 ${man(v)}.`};
  },
  rebid(){
    const M = r100(rnd(50,400)*100), p = pick([20,30]);
    return {q:`재매각 물건 최저매각가격 ${man(M)}, 입찰보증금이 최저가의 ${p}%로 정해졌습니다. 보증금은? (만원)`, num:M*p/100, tol:0, unit:"만원", e:`${man(M)} × ${p}% = ${man(M*p/100)}. 일반 물건(10%)보다 크다.`};
  },
  profit(){
    const L = r100(rnd(80,300)*100), R = rnd(3,20)*100, Mv = rnd(0,4)*50, S = r100(L*rnd(115,145)/100);
    const tax = Math.round(L*0.011), fee = Math.round(S*0.005);
    const v = S - fee - L - tax - R - Mv;
    return {q:`낙찰가 ${man(L)}, 취득세 1.1%, 수리비 ${man(R)}, 이사비 ${man(Mv)}, 매도가 ${man(S)}, 매도 중개수수료 0.5%. 세전 순수익은? (만원, 대출이자·양도세 제외)`, num:v, tol:2, unit:"만원",
      e:`${man(S)} − 수수료 ${man(fee)} − 낙찰가 ${man(L)} − 취득세 ${man(tax)} − 수리비 ${man(R)} − 이사비 ${man(Mv)} = ${man(v)}.`};
  },
  sched(){
    const d = new Date(2026, rnd(0,11), rnd(1,28));
    const correct = addDays(d,7);
    const opts = [correct, addDays(d,3), addDays(d,14), addDays(d,30)];
    return {q:`${fmt(d)}에 낙찰됐습니다. 매각허가결정은 보통 언제 날까요?`, o:opts.map(fmt), a:0,
      e:`매각기일 후 7일(${fmt(correct)}) 허가결정 → 다시 7일 뒤(${fmt(addDays(d,14))}) 확정 → 그 뒤 30일 안에 잔금.`};
  },
  small(){
    const L = r100(rnd(60,200)*100), C = rnd(15,30)*10;
    const total = r100((L-C)*rnd(55,80)/100);
    const cap = Math.floor((L)/2);
    const v = Math.min(total, cap);
    return {q:`낙찰가 ${man(L)}. 조건을 갖춘 소액임차인들이 각자 받을 최우선변제액 합계가 ${man(total)}입니다. 최우선변제로 실제 받을 수 있는 총액은? (만원, 한도: 주택가액의 절반)`, num:v, tol:1, unit:"만원",
      e:`한도 = 낙찰가의 절반 ${man(cap)}. 합계 ${man(total)}와 비교해 작은 쪽 ${man(v)}. (실무에선 경매비용을 뺀 금액의 절반으로 계산하기도 한다)`};
  }
};

  sol:"저당권 실행으로 인한 법정지상권은 저당권을 설정할 때 이미 토지 위에 건물이 있고, 토지와 건물의 소유자가 같아야 성립한다. 나대지에 저당을 잡은 뒤 지은 건물에는 원칙적으로 성립하지 않아, 乙은 건물 철거 등을 주장할 여지가 있다.",
  opt:["근저당 설정 당시 건물이 없었다.","법률 규정으로 생기는 권리라 등기 없이도 성립할 수 있다.","정답.","토지만 매각되었다.","근거 없다."],

 {lv:1, q:"분묘기지권에 대한 설명으로 옳지 않은 것은?",

 {lv:2, q:"'대지권미등기'와 '대지권 없음'에 대한 설명으로 가장 적절한 것은?",

const LS_KEY = "rights-study-v1";
const blank = () => ({q:{}, drill:{n:0, perfect:0, parts:0, partsOk:0}, known:{}, check:{}, updated:0});
let S = blank();
try{ const raw = localStorage.getItem(LS_KEY); if(raw) S = Object.assign(blank(), JSON.parse(raw)); }catch(e){}
let dbRef = null, saveTimer = null, saving = false, dirty = false;
const syncEl = () => document.getElementById("sync");
function save(){
  S.updated = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); if(window.gmwSaveOk) window.gmwSaveOk(); }catch(e){ if(window.gmwSaveFail) window.gmwSaveFail(e); }
  if(!dbRef) return;
  dirty = true; clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if(!dbRef || saving || !dirty) return;
  saving = true; dirty = false;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); syncEl().textContent = "모든 기기에 저장됨"; }
  catch(e){ syncEl().textContent = "이 기기에만 저장됨"; if(e && (e.code==="invalid_argument"||e.code==="revoked")) dbRef = null; }
  saving = false;
  if(dirty) flush();
}
(async () => {
  try{
    if(!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await ref.get();
    if(snap.exists){
      const remote = snap.data() || {};
      if((remote.updated||0) >= (S.updated||0)){ S = Object.assign(blank(), JSON.parse(JSON.stringify(remote))); try{localStorage.setItem(LS_KEY, JSON.stringify(S));}catch(e){} render(); }
    }
    dbRef = ref;
    initNotesRemote(db, uid);
    syncEl().textContent = "모든 기기에 저장됨";
    if(!snap.exists || (snap.data()||{}).updated < S.updated){ dirty = true; flush(); }
  }catch(e){}
})();

      <div class="h"><h3>${c.name}</h3><span class="grp">${GROUPS[c.g].name}</span></div>
      <p class="def">${c.def}</p>

      <div class="cardfoot"><button type="button" class="known" data-noteof="${c.id}">✏️ 필기</button><button type="button" class="known" data-known="${c.id}" aria-pressed="${!!S.known[c.id]}">${S.known[c.id]?"외웠어요 ✓":"외웠어요"}</button></div>
    </article>`).join("")}</div>`;

  m.innerHTML = `<section class="page">

function flashHTML(){
  const list = CONCEPTS.filter(c => noteFilter==="all" || c.g===noteFilter);
  if(!flash || flash.key!==noteFilter){
    const order = [...list.filter(c=>!S.known[c.id]), ...list.filter(c=>S.known[c.id])];
    flash = {key:noteFilter, order:order.map(c=>c.id), i:0, open:false};
  }
  if(flash.i >= flash.order.length) return `<div class="panel result"><div class="big">끝!</div><p>${list.length}장을 다 넘겼어요. 외운 카드 ${list.filter(c=>S.known[c.id]).length}장.</p><div class="row"><button type="button" class="btn pri" id="flashAgain">처음부터 다시</button></div></div>`;
  const c = CONCEPTS.find(x=>x.id===flash.order[flash.i]);
  return `<div class="panel flash">
    <div class="note mono">${flash.i+1} / ${flash.order.length} · ${GROUPS[c.g].name}</div>
    <div class="front">${c.name}</div>
    ${flash.open ? `<div class="back"><p class="def" style="margin:0 0 8px">${c.def}</p><div class="fate"><b>경매에서</b> · ${c.fate}</div></div>
      <div class="row"><button type="button" class="btn" data-fl="again">다시 볼래요</button><button type="button" class="btn pri" data-fl="known">외웠어요</button></div>`
    : `<div class="row"><button type="button" class="btn seal" data-fl="open">뜻 보기</button></div>`}
  </div>`;
}
document.addEventListener("click", e => {
  let b;
  if((b = e.target.closest("[data-nf]"))){ noteFilter = b.dataset.nf; flash = null; renderNotes(); }
  else if((b = e.target.closest("[data-nv]"))){ noteView = b.dataset.nv; flash = null; renderNotes(); }
  else if((b = e.target.closest("[data-known]"))){ const id = b.dataset.known; S.known[id] = !S.known[id]; if(!S.known[id]) delete S.known[id]; save(); b.setAttribute("aria-pressed", !!S.known[id]); b.textContent = S.known[id]?"외웠어요 ✓":"외웠어요"; }
  else if((b = e.target.closest("[data-jump]"))){ noteView="cards"; noteFilter="all"; renderNotes(); const el = document.getElementById("c-"+b.dataset.jump); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.style.outline="2px solid var(--seal)"; setTimeout(()=>el.style.outline="",1600);} }
  else if((b = e.target.closest("[data-fl]"))){
    const act = b.dataset.fl, id = flash.order[flash.i];
    if(act==="open") flash.open = true;
    else { if(act==="known") S.known[id] = true; else delete S.known[id]; save(); flash.i++; flash.open = false; }
    renderNotes();
  }
  else if(e.target.closest("#flashAgain")){ flash = null; renderNotes(); }
});

/* ============================== 퀴즈 ============================== */
const KIND_NAME = {ox:"OX", mc:"번호 고르기", sa:"주관식", calc:"계산"};
let quiz = null, quizMode = "all", quizTopics = new Set(Object.keys(TOPICS)), quizKinds = new Set(["ox","mc","sa","calc"]), quizLevels = new Set([1,2,3]), quizLen = 10;
const norm = s => String(s||"").toLowerCase().replace(/[\s·.,~\-_()%'"!?/]/g,"").replace(/^제/,"").replace(/(조|년|호)$/,"");
function checkSA(item, input){
  const v = norm(input); if(!v) return false;
  return item.ans.some(a => { const n = norm(a); return v===n || (n.length>=3 && v.includes(n)) || (v.length>=4 && n.includes(v)); });
}
function pool(){
  let list = QUIZ.filter(q => quizTopics.has(q.t) && quizKinds.has(q.k) && quizLevels.has(levelOf(q)));
  if(quizMode==="wrong") list = list.filter(q => S.q[q.id] && S.q[q.id].last===0);
  if(quizMode==="new") list = list.filter(q => !S.q[q.id]);
  return list;
}
function makeItem(q){
  let qq = q;
  if(q.gen){ qq = Object.assign({}, q, genItem(q.gen), {id:q.id, t:q.t, k:q.k, lv:q.lv}); }
  const it = {q:qq};
  if(qq.k==="mc") it.order = shuffle(qq.o.map((_,i)=>i));
  return it;
}
function startQuiz(list){
  quiz = {list:(list || shuffle(pool()).slice(0, quizLen)).map(makeItem), i:0, picked:null, input:"", ok:null, score:0, wrongIds:[]};
  if(page==="quiz") renderQuiz();
}
function record(id, ok){
  const r = S.q[id] || {c:0,w:0};
  if(ok) r.c++; else r.w++;
  r.last = ok?1:0; S.q[id] = r; save();
}
function renderQuiz(){
  const m = $("#main");
  if(!quiz){
    const n = pool().length;
    const topics = Object.entries(TOPICS).map(([k,v]) => `<button type="button" data-qt="${k}" aria-pressed="${quizTopics.has(k)}">${v}</button>`).join("");
    const kinds = Object.entries(KIND_NAME).map(([k,v]) => `<button type="button" data-qk="${k}" aria-pressed="${quizKinds.has(k)}">${v} <span class="mono" style="opacity:.6">${QUIZ.filter(q=>q.k===k).length}</span></button>`).join("");
    const wrongN = quizStats().wrongNow;
    m.innerHTML = `<section class="page">
      <div class="eyebrow">퀴즈</div>
      <h2 style="font-size:26px;margin-top:4px">OX · 번호 · 주관식 · 계산 ${QUIZ.length}문제</h2>
      <p class="lead">고른 조건 안에서 문제 순서와 보기 순서가 매번 무작위로 섞입니다. 계산 문제는 풀 때마다 숫자가 새로 나와요.</p>
      <div class="panel pad qsetup">
        <div><div class="note" style="margin-bottom:6px">어떤 문제를 풀까요?</div>
          <div class="filters" style="margin:0">
            <button type="button" data-qm="all" aria-pressed="${quizMode==="all"}">전체 섞기</button>
            <button type="button" data-qm="new" aria-pressed="${quizMode==="new"}">안 푼 문제</button>
            <button type="button" data-qm="wrong" aria-pressed="${quizMode==="wrong"}">틀린 문제 (${wrongN})</button>
          </div></div>
        <div><div class="note" style="margin-bottom:6px">난이도</div><div class="filters" style="margin:0">${[1,2,3].map(l=>`<button type="button" data-ql="${l}" aria-pressed="${quizLevels.has(l)}">${"★".repeat(l)}${"☆".repeat(3-l)} ${LEVEL_NAME[l]} <span class="mono" style="opacity:.6">${QUIZ.filter(q=>levelOf(q)===l).length}</span></button>`).join("")}</div></div>
        <div><div class="note" style="margin-bottom:6px">문제 형식</div><div class="filters" style="margin:0">${kinds}</div></div>
        <div><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="note">주제</span><span><button type="button" class="known" data-qall="1">모두 선택</button></span></div><div class="filters" style="margin:0">${topics}</div></div>
        <div class="row" style="justify-content:space-between;align-items:center">
          <span class="note">해당하는 문제 <b class="mono">${n}</b>개 · 한 번에
            <select id="qLen" style="font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);padding:2px 6px">${[10,20,30].map(v=>`<option ${v===quizLen?"selected":""}>${v}</option>`).join("")}</select>문제</span>
          <button type="button" class="btn seal" id="qStart" ${n?"":"disabled"}>시작하기</button>
        </div>
      </div>
    </section>`;
    return;
  }
  if(quiz.i >= quiz.list.length){
    const t = quiz.list.length;
    m.innerHTML = `<section class="page"><div class="panel result">
      <div class="eyebrow">결과</div>
      <div class="big">${quiz.score} / ${t}</div>
      <p>${quiz.score===t ? "전부 맞혔어요." : `틀린 ${t-quiz.score}문제는 '틀린 문제' 모드에서 다시 풀 수 있어요.`}</p>
      <div class="row">${quiz.wrongIds.length?`<button type="button" class="btn seal" id="qRetry">틀린 것만 바로 다시</button>`:""}<button type="button" class="btn pri" id="qAgain">같은 조건으로 새로 섞기</button><button type="button" class="btn" id="qSetup">설정으로</button></div>
    </div></section>`;
    return;
  }
  const it = quiz.list[quiz.i], q = it.q, done = quiz.ok !== null;
  const text = q.q;
  let body = "";
  if(q.k==="ox" || q.k==="mc"){
    const idxs = q.k==="ox" ? [0,1] : it.order;
    body = `<div class="choices${q.k==="ox"?" ox":""}">${idxs.map((idx,pos) => {
      let cls = "choice";
      if(done && idx===q.a) cls += " right"; else if(done && idx===quiz.picked) cls += " wrong";
      const label = q.k==="ox" ? ["O","X"][idx] : `<span class="n">${pos+1}</span><span>${esc(q.o[idx])}</span>`;
      return `<button type="button" class="${cls}" data-ans="${idx}" ${done?"disabled":""}>${label}</button>`;
    }).join("")}</div>`;
  } else {
    const unit = q.k==="calc" ? q.unit : "";
    body = `<form class="sa" id="saForm" autocomplete="off"><input id="saIn" class="${done?(quiz.ok?"right":"wrong"):""}" ${q.k==="calc"?'inputmode="decimal"':""} placeholder="${q.k==="calc"?"숫자만 입력":"답을 입력하세요"}" value="${esc(quiz.input)}" ${done?"disabled":""} aria-label="답">${unit?`<span class="unit">${unit}</span>`:""}${done?"":`<button type="submit" class="btn pri">확인</button>`}</form>`;
  }
  let explain = "";
  if(done){
    let right;
    if(q.k==="ox") right = ["O","X"][q.a];
    else if(q.k==="mc") right = `${it.order.indexOf(q.a)+1}번 (${esc(q.o[q.a])})`;
    else if(q.k==="sa") right = esc(q.show);
    else right = `${q.num.toLocaleString()}${q.unit}`;
    const e = q.e;
    explain = `<div class="explain">${quiz.ok?'<b class="ok">정답!</b>':`<b class="no">오답.</b> 정답은 <b>${right}</b>.`} ${quiz.ok && q.k==="sa" ? `(정답: ${right}) ` : ""}${esc(e)}
      ${!quiz.ok && q.k==="sa" ? `<div style="margin-top:8px"><button type="button" class="known" id="qOverride">같은 뜻으로 썼어요 → 정답 처리</button></div>` : ""}</div>
      <div class="qnext"><button type="button" class="btn pri" id="qNext">${quiz.i+1===quiz.list.length?"결과 보기":"다음 문제 →"}</button></div>`;
  }
  m.innerHTML = `<section class="page">
    <div class="qhead"><span>${quiz.i+1} / ${quiz.list.length}</span><span>맞힌 수 ${quiz.score}</span></div>
    <div class="bar" style="margin:-4px 0 14px"><i style="width:${Math.round(quiz.i/quiz.list.length*100)}%"></i></div>
    <div class="panel qbox">
      <span class="qtag">${TOPICS[q.t]||""} · ${KIND_NAME[q.k]}</span> <span class="qtag lv${levelOf(q)}">${"★".repeat(levelOf(q))} ${LEVEL_NAME[levelOf(q)]}</span>
      <div class="qtext">${esc(text)}</div>
      ${body}
      ${explain}
    </div>
    <div class="row" style="justify-content:flex-start;margin-top:12px"><button type="button" class="btn" id="qQuit">그만하기</button></div>
  </section>`;
  if(!done && (q.k==="sa"||q.k==="calc")){ const inp = $("#saIn"); if(inp && window.matchMedia("(min-width:641px)").matches) inp.focus(); }
  if(done){ const nx = $("#qNext"); if(nx && (q.k==="sa"||q.k==="calc")) nx.focus(); }
}
function answer(ok){
  const it = quiz.list[quiz.i];
  quiz.ok = ok;
  if(ok) quiz.score++; else quiz.wrongIds.push(it.q.id);
  record(it.q.id, ok);
  renderQuiz();
}
document.addEventListener("submit", e => {
  if(e.target.id!=="saForm") return;
  e.preventDefault();
  if(!quiz || quiz.ok!==null) return;
  const it = quiz.list[quiz.i], v = $("#saIn").value;
  if(!v.trim()) return;
  quiz.input = v;
  if(it.q.k==="calc"){
    const n = parseFloat(v.replace(/[,\s만원%]/g,""));
    answer(isFinite(n) && Math.abs(n - it.q.num) <= (it.q.tol||0) + 1e-9);
  } else answer(checkSA(it.q, v));
});
document.addEventListener("click", e => {
  let b;
  if((b = e.target.closest("[data-qm]"))){ quizMode = b.dataset.qm; renderQuiz(); }
  else if((b = e.target.closest("[data-qt]"))){ const k = b.dataset.qt; if(quizTopics.has(k) && quizTopics.size>1) quizTopics.delete(k); else quizTopics.add(k); renderQuiz(); }
  else if((b = e.target.closest("[data-ql]"))){ const k = +b.dataset.ql; if(quizLevels.has(k) && quizLevels.size>1) quizLevels.delete(k); else quizLevels.add(k); renderQuiz(); }
  else if((b = e.target.closest("[data-qk]"))){ const k = b.dataset.qk; if(quizKinds.has(k) && quizKinds.size>1) quizKinds.delete(k); else quizKinds.add(k); renderQuiz(); }
  else if(e.target.closest("[data-qall]")){ quizTopics = new Set(Object.keys(TOPICS)); renderQuiz(); }
  else if(e.target.closest("#qStart") || e.target.closest("#qAgain")){ startQuiz(); }
  else if(e.target.closest("#qSetup") || e.target.closest("#qQuit")){ quiz = null; renderQuiz(); }
  else if(e.target.closest("#qRetry")){ const ids = quiz.wrongIds; startQuiz(shuffle(QUIZ.filter(q=>ids.includes(q.id)))); }
  else if((b = e.target.closest("[data-ans]")) && quiz && quiz.ok===null){ quiz.picked = +b.dataset.ans; answer(quiz.picked===quiz.list[quiz.i].q.a); }
  else if(e.target.closest("#qOverride") && quiz && quiz.ok===false){
    const id = quiz.list[quiz.i].q.id;
    quiz.ok = true; quiz.score++; quiz.wrongIds = quiz.wrongIds.filter(x=>x!==id);
    const r = S.q[id]; if(r){ r.w = Math.max(0,r.w-1); r.c++; r.last = 1; save(); }
    renderQuiz();
  }
  else if(e.target.closest("#qNext")){ quiz.i++; quiz.picked = null; quiz.ok = null; quiz.input = ""; renderQuiz(); window.scrollTo(0,0); }
});
document.addEventListener("change", e => { if(e.target.id==="qLen"){ quizLen = +e.target.value; } });

  jeonse:{label:"전세권설정",gu:"을",cand:false,note:"건물 일부 · 배당요구 안 함"},
  imreg:{label:"주택임차권",gu:"을",cand:false,note:"임차권등기명령"}
};
const HOLDERS = {geun:["○○은행","△△새마을금고","□□캐피탈","○○농협"],gaap:["김○○","□□카드","△△상사"],ap:["○○세무서","○○구청"],damga:["박○○","○○대부"],bojeon:["이○○","최○○"],gacheo:["정○○","한○○"],cheol:["토지소유자 윤○○"],jisang:["○○전력"],jeonse:["송○○"],imreg:["임차인 강○○"]};
let drill = null, drillLevel = "basic";
const fmt = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

function makeDrill(){
  const hard = drillLevel==="hard";
  const n = hard ? rnd(4,6) : rnd(3,4);
  const pool = hard ? ["geun","geun","gaap","ap","damga","bojeon","bojeon","gacheo","cheol","jisang","jeonse","imreg"] : ["geun","geun","gaap","ap","bojeon","gacheo","jisang","jeonse","imreg"];
  const kinds = [];
  // 앞쪽에 인수 권리가 오는 문제를 일정 비율 섞는다
  if(Math.random() < 0.55) kinds.push(pick(["bojeon","gacheo","jisang","jeonse","imreg"]));
  while(kinds.length < n) kinds.push(pick(pool));
  if(!kinds.some(k=>KINDS[k].cand)) kinds[kinds.length-1] = "geun";
  let d = new Date(2014 + rnd(0,6), rnd(0,11), rnd(1,28));
  let no = rnd(10000, 60000);
  const rows = [{kind:"own", label:"소유권이전", gu:"갑", holder:"홍○○", note:"매매", date:new Date(d), no:no}];
  kinds.forEach((k, idx) => {
    const same = hard && idx>0 && Math.random()<0.28;
    if(!same){ d = addDays(d, rnd(20, 400)); no = rnd(10000, 90000); } else { no += rnd(3, 400); }
    rows.push({kind:k, label:KINDS[k].label, gu:KINDS[k].gu, holder:pick(HOLDERS[k]), note:KINDS[k].note, date:new Date(d), no});
  });
  d = addDays(d, rnd(60, 500)); no = rnd(10000,90000);
  const auctionType = rows.some(r=>r.kind==="geun") && Math.random()<0.7 ? "임의경매" : "강제경매";
  rows.push({kind:"gyeong", label:"경매개시결정", gu:"갑", holder:rows.find(r=>r.kind==="geun")?.holder || pick(["김○○","△△상사"]), note:auctionType, date:new Date(d), no});
  KINDS.gyeong = {cand:true};
  // 기준
  const cands = rows.filter(r => r.kind!=="own" && (r.kind==="gyeong" || KINDS[r.kind].cand));
  const base = cands[0];
  const bi = rows.indexOf(base);
  rows.forEach((r, i) => {
    if(r.kind==="own") { r.fate = null; return; }
    if(r===base) { r.fate = "gone"; r.why = "가장 먼저 등기된 돈이 목적인 권리라 말소기준권리입니다. 기준 자신도 낙찰로 소멸합니다."; return; }
    if(r.kind==="cheol"){ r.fate = "keep"; r.why = i<bi ? "기준보다 앞선 가처분이라 인수됩니다." : "건물철거·토지인도 가처분은 기준보다 뒤에 있어도 인수되는 예외입니다."; return; }
    if(i < bi){ r.fate = "keep"; r.why = `말소기준권리(${fmt(base.date)} ${base.label})보다 앞서 등기돼 낙찰자가 인수합니다.` + (r.kind==="bojeon" ? " 본등기하면 소유권을 뺏길 수 있습니다." : r.kind==="jeonse" ? " 배당요구를 안 한 선순위 전세권이라 인수입니다." : ""); return; }
    r.fate = "gone";
    r.why = (i>bi && r.date.getTime()===base.date.getTime()) ? "기준과 같은 날이지만 접수번호가 뒤라 후순위, 소멸합니다." : "말소기준권리보다 뒤에 있어 소멸합니다.";
  });
  // 임차인
  const bd = base.date;
  const opt = hard ? pick([-120,-30,-1,-1,0,0,5,60]) : pick([-120,-45,-1,0,10,60]);
  const moveIn = addDays(bd, opt);
  const hasFix = Math.random()<0.75;
  const fixDate = hasFix ? addDays(moveIn, rnd(0, 20)) : null;
  const deposit = pick([3000,5000,8000,12000,15000,20000]);
  const tenant = {moveIn, fixDate, deposit, daehang: moveIn.getTime() < bd.getTime()};
  tenant.why = tenant.daehang
    ? `전입 ${fmt(moveIn)} → 대항력은 ${fmt(addDays(moveIn,1))} 0시. 말소기준권리 접수일(${fmt(bd)})보다 ${opt===-1 ? "0시가 먼저라" : "먼저라"} 대항력이 있습니다. 배당에서 못 받은 보증금은 낙찰자가 물어줘야 합니다.`
    : `전입 ${fmt(moveIn)} → 대항력은 ${fmt(addDays(moveIn,1))} 0시. ${opt===0 ? "같은 날 접수된 말소기준권리가 앞서므로" : "말소기준권리보다 늦어서"} 대항력이 없습니다. 보증금은 배당으로만 받고 낙찰자가 떠안지 않습니다.`;
  return {rows, base, tenant, ans:{base:null, fate:{}, daehang:null}, graded:false};
}

      <p class="lead">낙찰대금을 순서대로 나눠 보세요. 임차인이 얼마를 받는지, 낙찰자가 얼마를 떠안는지 두 숫자를 맞히면 됩니다. 매번 새 사건이 나와요.</p>${tabs}${renderBae()}</section>`;

  if(!drill) drill = makeDrill();

  const g = drill.graded;

    let answer = "";
    if(!isOwn){
      if(!g){
        answer = `<div class="ans"><button type="button" class="basis" data-base="${i}" aria-pressed="${picked}">기준</button>

      } else {
        const isBase = r===drill.base;
        const okBase = (drill.ans.base===i) === isBase;
        const okFate = f===r.fate;
        answer = `<div>${isBase?'<span class="stamp base">기준</span> ':""}<span class="stamp ${r.fate}">${r.fate==="keep"?"인수":"소멸"}</span>
          <div class="fb ${okBase&&okFate?"ok":"no"}">${okBase&&okFate?"맞음":`내 답: ${drill.ans.base===i?"기준 · ":""}${f==="keep"?"인수":f==="gone"?"소멸":"선택 안 함"}`}</div>
          <div class="note" style="margin-top:2px">${r.why}</div></div>`;
      }
    } else answer = `<span class="note">새 주인은 낙찰자</span>`;
    return `<tr class="${g && r.fate==="gone"?"cancel-line":""}">
      <td class="num">${i+1}</td>
      <td class="dt">${fmt(r.date)}<small>제${r.no}호</small></td>
      <td class="purpose"><b>${r.label}<span class="gu">${r.gu}구</span></b>${r.note?`<small>${r.note}</small>`:""}</td>
      <td class="who">${r.holder}</td>
      <td class="act">${answer}</td></tr>`;
  }).join("");
  const t = drill.tenant;
  const tenantAns = !g
    ? `<div class="ans"><span class="note">대항력</span><span class="seg"><button type="button" data-dh="1" aria-pressed="${drill.ans.daehang===true}">있음</button><button type="button" data-dh="0" aria-pressed="${drill.ans.daehang===false}">없음</button></span></div>`
    : `<div><span class="stamp ${t.daehang?"keep":"gone"}">${t.daehang?"대항력 있음":"대항력 없음"}</span> <span class="fb ${drill.ans.daehang===t.daehang?"ok":"no"}">${drill.ans.daehang===t.daehang?"맞음":"틀림"}</span><div class="note" style="margin-top:4px">${t.why}</div></div>`;
  const filled = drill.ans.base!==null && drill.ans.daehang!==null && drill.rows.every((r,i)=>r.kind==="own"||drill.ans.fate[i]);
  let score = "";
  if(g){
    const res = drill.result;
    score = `<div class="panel score"><h3>${res.ok}/${res.total} 맞힘 ${res.ok===res.total?"· 완벽해요":""}</h3>
      <ul><li>말소기준권리: <b>${fmt(drill.base.date)} ${drill.base.label}</b> — 돈이 목적인 권리 중 가장 먼저 등기됨</li>
      <li>인수되는 권리: ${drill.rows.filter(r=>r.fate==="keep").map(r=>`${r.label}${r.note?`(${r.note.split(" ")[0]})`:""}`).join(", ") || "없음"}</li>
      <li>임차인: ${t.daehang?"대항력 있음 → 못 받은 보증금 인수 위험":"대항력 없음 → 보증금 인수 부담 없음"}</li></ul>
      <div class="row" style="justify-content:flex-start"><button type="button" class="btn seal" id="dNew">새 등기부 풀기</button></div></div>`;

      <thead><tr><th>순번</th><th>접수</th><th>등기목적</th><th>권리자</th><th>내 판정</th></tr></thead>

      ${tenantAns}
    </div>
    ${g ? score : `<div class="row" style="justify-content:flex-end;margin-top:14px"><span class="note" style="align-self:center">${filled?"":"아직 안 고른 칸이 있어요"}</span><button type="button" class="btn seal" id="dGrade" ${filled?"":"disabled"}>채점하기</button></div>`}
  </section>`;
}
document.addEventListener("click", e => {
  if(!drill) return;
  let b;
  if((b = e.target.closest("[data-base]")) && !drill.graded){ const i = +b.dataset.base; drill.ans.base = drill.ans.base===i ? null : i; if(drill.ans.base===i) drill.ans.fate[i] = "gone"; renderDrill(); }
  else if((b = e.target.closest("[data-fate]")) && !drill.graded){ const [i,f] = b.dataset.fate.split(":"); drill.ans.fate[+i] = f; renderDrill(); }
  else if((b = e.target.closest("[data-dh]")) && !drill.graded){ drill.ans.daehang = b.dataset.dh==="1"; renderDrill(); }
  else if((b = e.target.closest("[data-lv]"))){ drillLevel = b.dataset.lv; drill = makeDrill(); renderDrill(); }
  else if(e.target.closest("#dNew") || e.target.closest("#dNew2")){ drill = makeDrill(); renderDrill(); window.scrollTo(0,0); }
  else if(e.target.closest("#dGrade")){
    let ok = 0, total = 0;
    drill.rows.forEach((r,i) => { if(r.kind==="own") return; total++; const baseOk = (drill.ans.base===i) === (r===drill.base); if(baseOk && drill.ans.fate[i]===r.fate) ok++; });
    total++; if(drill.ans.daehang===drill.tenant.daehang) ok++;
    drill.result = {ok, total}; drill.graded = true;
    S.drill.n++; S.drill.parts += total; S.drill.partsOk += ok; if(ok===total) S.drill.perfect++; save();
    renderDrill();
  }
});

function calc2(){

  const app = num(C.appraisal), bid = num(C.bid), kb = num(C.kb), ltv = num(C.ltv), cost = num(C.cost), extra = num(C.extra) || 0;

  } else {

    loan = Math.min(a,b); basis = isFinite(a) ? `KB시세×LTV ${won(a)} · 낙찰가 80% ${won(b)} 중 낮은 쪽` : `낙찰가 80% (KB시세를 넣으면 비교합니다)`;
  }
  const fee = bid * (isFinite(cost)?cost:0)/100;
  const cash = bid - loan + fee + extra;
  out.innerHTML = `<div class="out">
    <div class="kv"><span>대출 가능 추정</span><b>${won(loan)}</b></div>

let drillTab = "reg", baeD = null;
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
function makeBae(){
  const L = r100(rnd(120,350)*100), C = rnd(15,35)*10;
  const tax = Math.random()<0.4 ? r100(rnd(3,15)*100) : 0;
  const d1 = new Date(2017+rnd(0,5), rnd(0,11), rnd(1,28));
  const g1 = r100(L*rnd(25,65)/100);
  const mv = addDays(d1, pick([-200,-60,-1,-1,30,120]));
  const hasFix = Math.random()<0.85;
  let fx = hasFix ? addDays(mv, pick([0,0,5,40,200])) : null;
  if(fx && sameDay(fx,d1)) fx = addDays(fx,1);
  const demand = Math.random()<0.8;
  const D = r100(rnd(30,200)*100);
  const has2 = Math.random()<0.6, d2 = addDays(d1, rnd(100,500)), g2 = r100(rnd(10,60)*100);
  const hasGa = Math.random()<0.5, d3 = addDays(has2?d2:d1, rnd(60,300)), ga = r100(rnd(5,40)*100);
  const daehang = mv < d1;
  let eff = null, effFromMove = false;
  if(hasFix && demand){ const e1 = addDays(mv,1); if(fx > e1){ eff = fx; } else { eff = e1; effFromMove = true; } }
  const claims = [{name:"근저당 ①", date:d1, amt:g1, rank:+d1, tie:1}];
  if(eff) claims.push({name:"임차인 (우선변제)", tenant:true, date:eff, amt:D, rank:+eff, tie: effFromMove?0:2});
  if(has2) claims.push({name:"근저당 ②", date:d2, amt:g2, rank:+d2, tie:1});
  claims.sort((a,b)=>a.rank-b.rank || a.tie-b.tie);
  let rest = L; const table = [];
  const take = (row) => { const g = Math.min(row.amt, rest); rest -= g; table.push(Object.assign({}, row, {got:g})); };
  take({name:"경매비용", amt:C, why:"0순위"});
  if(tax) take({name:"당해세", amt:tax, why:"3순위(그 집에 매겨진 세금)"});
  claims.forEach(c => take(Object.assign(c, {why: c.tenant ? `대항력+확정일자 갖춘 날 ${fmt(c.date)}${effFromMove?" 0시":""}` : `접수일 ${fmt(c.date)}`})));
  if(hasGa) take({name:"가압류", amt:ga, date:d3, why:`접수일 ${fmt(d3)} · 맨 뒤라 남은 돈만`});
  const tGot = (table.find(r=>r.tenant)||{got:0}).got;
  const insu = daehang ? D - tGot : 0;
  let tenantNote;
  if(!demand) tenantNote = "배당요구를 안 해서 배당에 참여하지 못한다.";
  else if(!hasFix) tenantNote = "확정일자가 없어 우선변제권이 없다(소액임차인 최우선변제는 이 연습에서 뺐다).";
  else tenantNote = `우선변제 순위일은 전입 다음 날 0시(${fmt(addDays(mv,1))})와 확정일자(${fmt(fx)}) 중 늦은 날.`;
  return {L,C,tax,d1,g1,mv,fx,demand,D,has2,d2,g2,hasGa,d3,ga,daehang,table,rest,tGot,insu,tenantNote,in1:"",in2:"",graded:false};
}

  }
  return `<div class="panel pad" style="display:grid;gap:12px">

      </div>
      <form id="baeForm" class="f2" autocomplete="off">
        <div class="f"><label for="b_in1">임차인이 배당받는 금액 (만원)</label><input id="b_in1" inputmode="numeric" value="${esc(b.in1)}" ${g?"disabled":""}></div>

 {id:"insu", title:"선순위 임차인 인수금액", lead:"대항력 있는 선순위 임차인이 배당에서 다 못 받으면, 나머지는 낙찰자가 떠안습니다.",

 {id:"shop", title:"상가 시세·수익률", lead:"그 동네 적정 수익률로 '월세 × 환산값 + 보증금'을 계산합니다.",

async function flushNote(id){

  try{ if(n) await notesCol.doc(id).set(JSON.parse(JSON.stringify(n))); else await notesCol.doc(id).delete(); setNoteStatus("모든 기기에 저장됨"); }

async function initNotesRemote(db, uid){

    Object.entries(remote).forEach(([id,r]) => { const l = NOTES[id]; if(!l || (r.updated||0) >= (l.updated||0)) NOTES[id] = Object.assign({id}, r); });
    Object.keys(NOTES).forEach(id => { if(!remote[id] || (remote[id].updated||0) < (NOTES[id].updated||0)) queueNote(id); });

function insertAtCursor(ta, text){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? ta.value.length;
  const lineStart = ta.value.lastIndexOf("\n", s-1) + 1;
  const prefix = (text.length<12 && s!==lineStart) ? "\n" : "";
  ta.value = ta.value.slice(0,s) + prefix + text + ta.value.slice(e);
  const pos = s + prefix.length + text.length; ta.focus(); ta.setSelectionRange(pos,pos);
  ta.dispatchEvent(new Event("input", {bubbles:true}));
}
function copyText(txt, btn, label){
  const done = () => { btn.textContent = "복사됨"; setTimeout(()=>btn.textContent=label,1500); };
  try{ navigator.clipboard.writeText(txt).then(done, () => { btn.textContent = "복사가 막혔어요 — 직접 선택해 복사하세요"; }); }catch(err){ btn.textContent = "복사가 막혔어요"; }
}

}

function renderWBResult(){

  $("#main").innerHTML = `<section class="page">
    <div class="panel result">
      <div class="eyebrow">${esc(wbS.title)} 채점 결과</div>

    </div>

    <div class="res-grid">${items.map((q,k)=>`<button type="button" class="res-b ${res[k]?"ok":"no"}" data-wbrev="${k}"><span class="mono">${k+1}</span><b>${res[k]?"○":"✕"}</b><small>${q.u}단원 ${"★".repeat(q.lv)}</small></button>`).join("")}</div>
    <div class="row" style="justify-content:flex-start;margin-top:16px">
      ${res.some(r=>!r)?`<button type="button" class="btn seal" id="wbRetryWrong">틀린 문항만 다시 연습</button>`:""}
      <button type="button" class="btn" id="wbHome">문제집 목록으로</button></div>
  </section>`;
}
function pickExam(n){
  const byU = UNITS.map(u => shuffle(WB.filter(q=>q.u===u.u)));
  const out = []; let r = 0;
  while(out.length < n && byU.some(l=>l.length)){ const l = byU[r % byU.length]; if(l.length) out.push(l.pop()); r++; }
  return shuffle(out);
}
document.addEventListener("click", e => {
  let b;
  if((b = e.target.closest("[data-qtab]"))){ quizTab = b.dataset.qtab; renderQuiz(); return; }
  if(page!=="quiz" || quizTab!=="wb") return;
  if((b = e.target.closest("[data-wbu]"))){ const u = +b.dataset.wbu, mode = b.dataset.wbm, unit = UNITS.find(x=>x.u===u); const items = WB.filter(q=>q.u===u); startWB(mode==="exam"?shuffle(items):items, mode, `${u}단원 ${mode==="exam"?"평가":"연습"}`); }
  else if(e.target.closest("#wbExam")){ startWB(pickExam(20), "exam", "실전 모의고사"); }
  else if(e.target.closest("#wbWrong")){ const st = wbStat(); startWB(WB.filter(q=>st[q.id]&&st[q.id].last===0), "practice", "오답 다시 풀기"); }
  else if(e.target.closest("#wbHard")){ startWB(shuffle(WB.filter(q=>q.lv===3)), "practice", "고난도 연습"); }
  else if((b = e.target.closest("[data-wbo]")) && wbS){
    const q = wbS.items[wbS.review!==null?wbS.review:wbS.i]; const k = +b.dataset.wbo;
    wbS.ans[q.id] = k;
    if(wbS.mode==="practice"){ wbS.shown[q.id] = true; wbRecord(q.id, wbCheck(q,k)); }
    wbS.confirm = false; renderWB();
  }
  else if(e.target.closest("#wbNext")){ if(wbS.i < wbS.items.length-1){ wbS.i++; renderWB(); window.scrollTo(0,0); } else { wbS.graded = true; wbS.review = null; renderWB(); window.scrollTo(0,0); } }
  else if((b = e.target.closest("[data-wbgo]")) && wbS){ const k = +b.dataset.wbgo; if(k>=0 && k<wbS.items.length){ const inp = $("#wbIn"); if(inp && !inp.disabled){ const q = wbS.items[wbS.i]; wbS.ans[q.id] = inp.value; } wbS.i = k; wbS.confirm = false; renderWB(); window.scrollTo(0,0); } }
  else if(e.target.closest("#wbSubmit")){
    const inp = $("#wbIn"); if(inp){ const q = wbS.items[wbS.i]; wbS.ans[q.id] = inp.value; }
    if(!wbS.confirm){ wbS.confirm = true; renderWB(); return; }
    wbS.graded = true; wbS.review = null; wbS.items.forEach(q=>wbRecord(q.id, wbCheck(q, wbS.ans[q.id]))); renderWB(); window.scrollTo(0,0);
  }
  else if((b = e.target.closest("[data-wbrev]")) && wbS){ const k = +b.dataset.wbrev; if(k>=0 && k<wbS.items.length){ wbS.review = k; if(wbS.mode==="practice") wbS.shown[wbS.items[k].id] = true; renderWB(); window.scrollTo(0,0); } }
  else if(e.target.closest("#wbBackRes")){ wbS.review = null; renderWB(); window.scrollTo(0,0); }
  else if(e.target.closest("#wbRetryWrong")){ const items = wbS.items.filter(q=>!wbCheck(q, wbS.ans[q.id])); startWB(items, "practice", "틀린 문항 다시"); }
  else if(e.target.closest("#wbHome") || e.target.closest("#wbQuit")){ wbS = null; renderWB(); window.scrollTo(0,0); }
  else if(e.target.closest("#wbOverride") && wbS){ const q = wbS.items[wbS.review!==null?wbS.review:wbS.i]; wbS.ans[q.id] = q.ans[0]; const r = wbStat()[q.id]; if(r){ r.w = Math.max(0,r.w-1); r.c++; r.last = 1; save(); } renderWB(); }
});
document.addEventListener("submit", e => {
  if(e.target.id!=="wbForm" || !wbS) return;
  e.preventDefault();
  const q = wbS.items[wbS.review!==null?wbS.review:wbS.i], v = $("#wbIn").value;
  if(!v.trim()) return;
  wbS.ans[q.id] = v;
  if(wbS.mode==="practice"){ wbS.shown[q.id] = true; wbRecord(q.id, wbCheck(q,v)); renderWB(); }
  else { if(wbS.i < wbS.items.length-1){ wbS.i++; } renderWB(); window.scrollTo(0,0); }
});

/* 첫 화면은 모든 코드가 정의된 뒤에 그린다 */
/* ============================== 실전 — 사건 분석 연습 · 내 물건 분석 ============================== */
/* 규칙 요약(사이트 전체와 동일)
   - 말소기준 후보: 근저당·저당·가압류·압류·담보가등기·강제경매개시결정, 배당요구(또는 경매신청)한 선순위 전세권
   - 기준보다 먼저 = 인수, 뒤 = 소멸. 예외: 건물철거·토지인도 가처분은 순위와 무관하게 인수
   - 임차인 대항력 = 전입 다음 날 0시 → 전입일이 기준 등기일보다 '앞'이어야 있음
   - 우선변제 순위일 = max(전입 다음 날 0시, 확정일자), 배당요구 필수
   - 배당: 경매비용 → 최우선변제(입력 시) → 당해세 → 날짜순. 가압류·강제경매 채권은 안분 후 흡수 */

const REAL_TYPES = [
  ["소유권","own"],["근저당","mort"],["저당","mort"],["가압류","gaap"],["압류","ap"],
  ["담보가등기","gdam"],["가등기","gbo"],["가처분","gproc"],["전세권","jeonse"],["지상권","jisang"],
  ["지역권","jiyeok"],["임차권","imcha"],["임의경매","auction"],["강제경매","gangje"],["기타","etc"]
];
const REAL_TYPE_NAMES = REAL_TYPES.map(t=>t[0]);
function realCat(type){
  const t = String(type||"");
  if(/소유권/.test(t) && !/가등기|청구권/.test(t)) return "own";
  if(/근저당|저당/.test(t)) return "mort";
  if(/가압류/.test(t)) return "gaap";
  if(/압류/.test(t)) return "ap";
  if(/담보가등기/.test(t)) return "gdam";
  if(/가등기/.test(t)) return "gbo";
  if(/가처분/.test(t)) return "gproc";
  if(/전세권/.test(t)) return "jeonse";
  if(/지상권/.test(t)) return "jisang";
  if(/지역권/.test(t)) return "jiyeok";
  if(/임차권/.test(t)) return "imcha";
  if(/강제경매/.test(t)) return "gangje";
  if(/임의경매|경매개시/.test(t)) return "auction";
  return "etc";
}
const REAL_UNSECURED = {gaap:1, gangje:1};
const realD = s => { if(!s) return null; if(s instanceof Date) return s; const m = String(s).match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/); if(!m) return null; const d = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(d) ? null : d; };
const realFmt = d => d ? fmt(d) : "—";

/* ---------- 분석 엔진 ---------- */
function realAnalyze(c){
  const rights = c.rights.filter(r=>realD(r.date)).map((r,i)=>Object.assign({}, r, {i, d:realD(r.date), cat:realCat(r.type), amt:+r.amt||0}))
    .sort((a,b)=> a.d-b.d || (+a.no||0)-(+b.no||0) || a.i-b.i);
  const isBaseCand = r => ["mort","gaap","ap","gdam","gangje"].includes(r.cat) || (r.cat==="jeonse" && r.demand);
  const base = rights.find(isBaseCand) || null;
  const fates = {};
  rights.forEach(r => {
    let f, why;
    if(r.cat==="own"){ f="-"; why="소유권 — 판정 대상 아님"; }
    else if(base && r===base){ f="소멸"; why = r.cat==="jeonse" ? "말소기준권리 — 선순위 전세권자가 배당요구(또는 경매신청)해서 기준이 됨(건물 전부 전세권일 때)" : "말소기준권리 — 가장 먼저 등기된, 돈이 목적인 권리"; }
    else if(r.cat==="auction"){ f="소멸"; why="경매개시결정 등기 — 매각으로 말소"; }
    else if(r.cat==="gproc" && /철거|인도/.test(r.note||"")){ f="인수"; why="건물철거·토지인도 가처분 — 순위와 상관없이 인수(건물을 잃을 수 있음)"; }
    else if(!base){ f="인수"; why="말소기준권리가 없어 전부 인수로 봐야 한다 — 매각물건명세서 확인 필수"; }
    else if(r.d < base.d || (+r.d===+base.d && (+r.no||0) < (+base.no||0))){
      f="인수";
      why = {gbo:"기준보다 먼저인 보전가등기 — 본등기되면 소유권을 잃을 수 있다", gproc:"기준보다 먼저인 가처분 — 본안에서 지면 소유권을 잃을 수 있다",
             jeonse:"기준보다 먼저인 전세권 — 배당요구를 안 해서 낙찰자가 보증금을 떠안는다", jisang:"기준보다 먼저인 지상권 — 낙찰자가 떠안는다",
             jiyeok:"기준보다 먼저인 지역권 — 낙찰자가 떠안는다", imcha:"기준보다 먼저인 임차권등기 — 보증금 인수 가능성(임차인 표 확인)"}[r.cat] || "말소기준보다 먼저 등기 → 인수";
    } else { f="소멸"; why="말소기준 이후 등기 → 매각으로 소멸"; }
    fates[r.i] = {f, why};
  });
  const baseD = base ? base.d : null;
  const tenants = c.tenants.map((t,j)=>{
    const move = realD(t.move), fix = realD(t.fix), dep = +t.dep||0, prio = Math.min(+t.prio||0, dep);
    const dh = !!move && (!baseD || move < baseD);
    let eff = null, effFromMove = false;
    if(move && fix && t.demand){ const e1 = addDays(move,1); if(fix > e1){ eff = fix; } else { eff = e1; effFromMove = true; } }
    return {j, name:t.name||`임차인 ${j+1}`, move, fix, demand:!!t.demand, dep, prio: t.demand ? prio : 0, dh, eff, effFromMove, got:0};
  });

  /* 배당 */
  const sale = +c.sale||0, cost = +c.cost||0, tax = +c.tax||0;
  let pool = sale; const table = [];
  const pay = (name, amt, why, ref) => { const g = Math.max(0, Math.min(amt, pool)); pool -= g; table.push({name, amt, got:g, why}); if(ref) ref.got += g; return g; };
  pay("경매비용", cost, "0순위");
  tenants.filter(t=>t.prio>0).forEach(t => pay(`${t.name} (최우선변제)`, t.prio, "소액임차인 최우선변제 — 입력한 금액", t));
  if(tax) pay("당해세", tax, "3순위 — 그 집에 매겨진 세금(2023.4 이후 규정 변경은 별도 확인)");
  const claims = [];
  rights.forEach(r => {
    if(["mort","gdam","ap"].includes(r.cat) && r.amt) claims.push({name:`${r.type}${r.holder?` (${r.holder})`:""}`, amt:r.amt, d:r.d, tie:1, no:+r.no||0, sec:true, why:`접수일 ${fmt(r.d)}`});
    else if(r.cat==="jeonse" && r.amt && (r.demand || r===base)) claims.push({name:`전세권${r.holder?` (${r.holder})`:""}`, amt:r.amt, d:r.d, tie:1, no:+r.no||0, sec:true, why:`접수일 ${fmt(r.d)} · 배당요구`});
    else if(REAL_UNSECURED[r.cat] && r.amt) claims.push({name:`${r.type}${r.holder?` (${r.holder})`:""}`, amt:r.amt, d:r.d, tie:1, no:+r.no||0, sec:false, why:`접수일 ${fmt(r.d)} · 우선변제권 없음 → 안분`});
  });
  tenants.forEach(t => { if(t.eff) claims.push({name:`${t.name} (우선변제)`, amt:t.dep - t.got, d:t.eff, tie: t.effFromMove?0:2, no:0, sec:true, tenant:t, why:`전입 다음 날 0시와 확정일자 중 늦은 날 ${fmt(t.eff)}${t.effFromMove?" 0시":""}`}); });
  claims.sort((a,b)=> a.d-b.d || a.tie-b.tie || a.no-b.no);
  let k = 0, anbun = false;
  while(k < claims.length){
    const c1 = claims[k];
    if(c1.sec){ pay(c1.name, c1.amt, c1.why, c1.tenant); k++; continue; }
    /* 안분: 이 채권과 뒤의 모든 채권이 남은 돈을 금액 비율로 나눈 뒤, 뒤의 우선변제권자가 자기보다 뒤 채권의 몫을 흡수 */
    const grp = claims.slice(k), sum = grp.reduce((s,x)=>s+x.amt,0);
    anbun = pool < sum;  /* 돈이 모자랄 때만 실제로 안분이 일어난다 */
    const share = grp.map(x => pool >= sum ? x.amt : (sum ? pool * x.amt / sum : 0));  /* 돈이 충분하면 전액, 모자라면 비율대로 */
    grp.forEach((x,gi) => { if(!x.sec) return; let need = x.amt - share[gi];
      for(let z = grp.length-1; z > gi && need > 0; z--){ const take = Math.min(need, share[z]); share[z] -= take; share[gi] += take; need -= take; } });
    grp.forEach((x,gi) => { const g = Math.round(share[gi]); table.push({name:x.name, amt:x.amt, got:g, why: !anbun ? x.why.replace(" → 안분","") : x.sec ? x.why + " · 안분 후 뒤 채권에서 흡수" : x.why}); if(x.tenant) x.tenant.got += g; });
    pool = Math.max(0, pool - grp.reduce((s,x,gi)=>s+Math.round(share[gi]),0));
    break;
  }
  /* 인수액 */
  const insuItems = [];
  tenants.forEach(t => { if(t.dh){ const left = t.dep - t.got; if(left>0) insuItems.push({name:t.name, amt:left, why: !t.demand ? "대항력 있음 + 배당요구 안 함 → 보증금 전액 인수" : `대항력 있음 → 못 받은 ${man(left)} 인수`}); } });
  rights.forEach(r => { if(fates[r.i] && fates[r.i].f==="인수"){ if(r.cat==="jeonse" && r.amt) insuItems.push({name:`선순위 전세권`, amt:r.amt, why:"배당요구 안 한 선순위 전세권 → 보증금 인수"}); } });
  const danger = rights.filter(r => fates[r.i] && fates[r.i].f==="인수" && ["gbo","gproc","jisang","jiyeok","imcha","etc"].includes(r.cat));
  const insu = insuItems.reduce((s,x)=>s+x.amt,0);
  return {rights, base, fates, tenants, table, rest:pool, insu, insuItems, danger, anbun, sale, cost, tax};
}

/* 최대 입찰가: 입찰가×(1+취득비율) + 인수 + 기타비용 + 목표수익 = 예상 매도가 */
function realMaxBid(a, c){
  const sell = +c.sellPrice||0; if(!sell) return null;
  const rate = (+c.acqRate||0)/100, extra = +c.extra||0, profit = +c.profit||0;
  const v = (sell - a.insu - extra - profit) / (1 + rate);
  return Math.floor(v/10)*10;
}

  ld = addDays(ld, rnd(30,300));

  const nT = pick([0,1,1,1,2]);
