services:
  - type: web
    name: molit-price-estimator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir webapp --bind 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: MOLIT_SERVICE_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
