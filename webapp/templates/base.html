<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주영이의 빌라 경매 매도가 계산기</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ deploy_version }}">
</head>
<body>
{% block content %}{% endblock %}
{% block footer %}
<footer>
  ⚠️ 이 결과는 국토교통부 실거래가 데이터를 통계적으로 가공한 참고용 추정치이며,
  실제 매도가를 보장하지 않습니다. 최종 판단은 공인중개사·감정평가사 등
  전문가 확인을 거치세요.
  <br><span style="opacity:.75">버전 {{ deploy_version }}</span>
</footer>
{% endblock %}

<div id="loading-overlay">
  <div class="load-box">
    <div class="load-head">
      <div class="spinner"></div>
      <p id="loading-text">실거래가 조회 중이에요, 처음 보는 지역이면 최대 1~2분 정도 걸릴 수 있어요…</p>
    </div>
    <!-- 좁은 화면에서만 보이는 팁 목록(37절). 넓은 화면은 예전처럼 위
         문구 한 줄이 돌아간다 — 아래 JS의 TIPS_AS_LIST 참고. -->
    <div id="loading-tips-wrap" hidden>
      <div class="load-tips-head">기다리는 동안 읽어보세요</div>
      <ul id="loading-tips"></ul>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}?v={{ deploy_version }}" defer></script>
</body>
</html>
