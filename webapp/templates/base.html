<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빌라 매매가 계산기</title>
<style>
  :root {
    color-scheme: light;
    --primary: #03c75a;
    --primary-dark: #02a94d;
    --primary-tint: #e6f9ee;
    --ink: #1c1e21;
    --muted: #555b61;
    --muted-2: #6e757b;
    --bg: #f2f4f6;
    --card: #ffffff;
    --border: #e7e9ec;
    --danger-bg: #fdecec;
    --danger: #d33232;
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow: 0 1px 2px rgba(20, 24, 28, 0.04), 0 4px 14px rgba(20, 24, 28, 0.05);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    max-width: 720px; margin: 0 auto; padding: 24px 16px 48px;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    /* 한글은 기본값(break-word)으로 두면 어절 한가운데서 줄이 끊겨
       ("팔리긴 / 팔리는" 이 아니라 "팔리 / 긴 팔리는") 읽는 흐름이 계속
       끊긴다. keep-all로 어절 단위로만 넘기고, 대신 URL처럼 긴 통짜
       문자열은 overflow-wrap으로 넘치지 않게 잡아준다. */
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  @media (min-width: 900px) {
    body { max-width: 1000px; }
  }
  /* 8-1절 — 가격 분포 그래프를 히어로 카드에서 빼내 전용 카드로 넓게
     보여주면서, 넓은 모니터에서는 본문 자체도 조금 더 넓게 쓴다
     (사용자가 모바일이 아니라 데스크톱으로만 본다고 확인해줬다). */
  @media (min-width: 1280px) {
    body { max-width: 1180px; }
  }
  h1 { font-size: 21px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.3px; }
  h3 { font-size: 16.5px; font-weight: 800; margin: 0 0 12px; color: var(--ink); }
  a { color: var(--primary-dark); }

  form {
    display: flex; flex-direction: column; gap: 14px;
    background: var(--card); padding: 22px; border-radius: var(--radius-lg);
    border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  label { font-size: 13px; font-weight: 600; color: #4a4f54; display: block; }
  input[type="text"], input[type="number"], input[type="password"] {
    padding: 11px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
    font-size: 15px; width: 100%; margin-top: 6px; background: #fafbfc;
    transition: border-color .15s ease, background .15s ease;
  }
  input[type="text"]:focus, input[type="number"]:focus, input[type="password"]:focus, textarea:focus {
    outline: none; border-color: var(--primary); background: #fff;
  }
  textarea { background: #fafbfc; transition: border-color .15s ease, background .15s ease; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  details.adv {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: #fafbfc; overflow: hidden;
  }
  details.adv summary {
    list-style: none; cursor: pointer; padding: 12px 14px;
    font-size: 13.5px; font-weight: 700; color: #4a4f54;
    display: flex; align-items: center; gap: 6px;
  }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary::before {
    content: "▸"; color: var(--muted-2); font-size: 11px; transition: transform .15s ease;
  }
  details.adv[open] summary::before { transform: rotate(90deg); }
  details.adv summary .muted { font-size: 13px; font-weight: 500; }
  details.adv .adv-body {
    padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 14px;
    border-top: 1px solid var(--border);
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: #4a4f54;
  }
  .checkbox-row input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--primary); }
  button {
    padding: 14px; border: none; border-radius: var(--radius-md);
    background: var(--primary); color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background .15s ease;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: var(--muted-2); cursor: default; }

  .error {
    background: var(--danger-bg); color: var(--danger); padding: 12px 14px;
    border-radius: var(--radius-md); margin-bottom: 12px; font-size: 14px; font-weight: 600;
  }
  .hint { color: var(--muted); font-size: 13.5px; line-height: 1.75; margin: 6px 2px 0; }

  .card {
    background: var(--card); padding: 20px 22px; border-radius: var(--radius-lg);
    border: 1px solid var(--border); margin-bottom: 14px; box-shadow: var(--shadow);
  }

  /* 히어로 카드 + 가격 구간별 매도 전략을 나란히 놓는 행 —
     넓은 화면에서만 2열, 좁은 화면(대부분의 방문자)에서는 그대로 세로로 쌓인다 */
  .hero-row { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  /* 사용자 요청 — "가격 구간별 매도 전략을 더 크게, 경매용 매도가 칸은
     조금 더 작게". 원래는 히어로가 더 넓었는데(1.35fr 1fr) 비율을 뒤집었다:
     실제로 보는 건 구간별 전략 표 쪽이고, 히어로는 큰 숫자 하나라 좁아도
     읽히기 때문이다. */
  @media (min-width: 900px) {
    .hero-row.two-col { grid-template-columns: 1fr 1.3fr; }
  }
  .hero-row .card { margin-bottom: 0; }
  .tier-table-wrap { overflow-x: auto; }
  /* 열이 많은 표(핵심 비교거래 7열 등)는 좁은 화면에서 카드 밖으로 삐져나가
     페이지 전체에 가로 스크롤이 생긴다 — 표만 따로 스크롤되게 감싼다. */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* 43절 임장 체크 — 결과 페이지에서 바로 체크하고 재계산하는 칩형 체크박스 */
  .insp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .insp-box, .insp-clean {
    display: flex; align-items: center; gap: 7px; cursor: pointer;
    padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
    background: #fff; font-size: 13.5px; font-weight: 600; color: var(--ink);
    transition: border-color .12s ease, background .12s ease;
  }
  .insp-clean { margin-top: 8px; }
  .insp-box input, .insp-clean input { width: 16px; height: 16px; accent-color: #e0475a; flex-shrink: 0; }
  .insp-clean input { accent-color: var(--primary); }
  .insp-box.on { border-color: #e0475a; background: #fff5f5; color: #c0293c; }
  .insp-clean.on { border-color: var(--primary); background: var(--primary-tint); color: var(--primary-dark); }

  /* 28절 매물 붙여넣기 — 41절 진단의 "경쟁 매물" 항목 안에 접어 넣는다.
     쓸 때만 펼쳐지니 결과 페이지가 덜 장황해지고, "이 항목이 왜 정보
     없음인지 → 여기서 채우면 된다"가 한자리에서 이어진다. */
  .paste-fold { margin-top: 10px; }
  .paste-fold > summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px; border: 1.5px dashed var(--border);
    background: #fff; font-size: 13px; font-weight: 700; color: var(--primary-dark);
  }
  .paste-fold > summary::-webkit-details-marker { display: none; }
  .paste-fold > summary:hover { border-color: var(--primary); background: var(--primary-tint); }
  .paste-fold[open] > summary { border-style: solid; border-color: var(--primary); background: var(--primary-tint); }
  /* 40절 인근 아파트 대비 — 아파트 ㎡당가를 100으로 놓고 빌라를 그 비율만큼
     칠해서, 갭이 얼마나 벌어져 있는지 길이로 바로 보이게 한다. */
  .gap-bars { display: flex; flex-direction: column; gap: 9px; }
  .gap-row { display: flex; align-items: center; gap: 10px; }
  .gap-label { flex: 0 0 118px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .gap-track { flex: 1; height: 16px; border-radius: 999px; background: #eceef1; overflow: hidden; }
  .gap-fill { display: block; height: 100%; border-radius: 999px; }
  .gap-val { flex: 0 0 auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
  @media (max-width: 520px) {
    .gap-label { flex-basis: 88px; font-size: 12.5px; }
    .gap-val { font-size: 12.5px; }
  }
  /* ── 입력 화면(46절) — 첫 화면은 "뭘 넣어야 하는지"만 빠르게 읽혀야 한다.
     라벨이 전부 같은 무게라 눈이 미끄러지던 걸, 필드마다 아이콘 타일을 붙여
     구분했다. 일러스트는 이미지 파일 대신 CSS 그라데이션+이모지로 만든다 —
     37절에서 이미지를 걷어내며 static 폴더를 없앴고, 다시 넣으면 용량·로딩·
     라이선스 부담이 따라온다. */
  .home-hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #eafaf0 0%, #f4fbff 58%, #fdf6ea 100%);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 24px 26px; margin-bottom: 14px;
  }
  .home-hero::after {
    content: "🏙️"; position: absolute; right: 18px; bottom: -10px;
    font-size: 86px; opacity: .18; line-height: 1; pointer-events: none;
  }
  .home-hero h1 { margin: 0 0 6px; font-size: 25px; }
  .home-hero .home-sub { font-size: 13.5px; color: #4a5358; line-height: 1.7; margin: 0; max-width: 620px; }
  .home-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .home-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, .85);
    border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--primary-dark);
  }

  .form-section {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0 12px; font-size: 15.5px; font-weight: 800; color: var(--ink);
  }
  .form-section::before {
    content: ""; width: 4px; height: 17px; border-radius: 2px; background: var(--primary);
  }
  .form-section .form-section-hint { font-size: 13px; font-weight: 600; color: var(--muted-2); }

  /* 아이콘 타일 + 입력칸 한 줄 */
  .field { display: flex; align-items: center; gap: 11px; }
  .field-icon {
    flex: 0 0 42px; height: 42px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; background: var(--primary-tint); border: 1px solid var(--border);
  }
  .field-body { flex: 1; min-width: 0; }
  .field-body label { display: block; }
  @media (max-width: 420px) {
    .field-icon { flex-basis: 36px; height: 36px; font-size: 16px; }
    .home-hero { padding: 20px 18px; }
    .home-hero h1 { font-size: 21px; }
  }

  /* 큼직한 제출 버튼 */
  .cta-submit {
    width: 100%; margin-top: 16px; padding: 17px 20px; border: 0;
    border-radius: var(--radius-lg); cursor: pointer;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -0.2px;
    box-shadow: 0 4px 14px rgba(3, 199, 90, .28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .cta-submit:hover { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(3, 199, 90, .34); }
  .cta-submit:disabled { opacity: .6; cursor: default; transform: none; }

  /* 하단 안내 줄 */
  .home-note {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 11px 13px; border-radius: var(--radius-md);
    background: #fafbfc; border: 1px solid var(--border);
    font-size: 13.5px; line-height: 1.75; color: var(--muted); margin-top: 9px;
  }
  .home-note b { color: #4a5358; }

  .paste-fold-body {
    margin-top: 10px; padding: 14px; background: #fff;
    border: 1px solid var(--border); border-radius: var(--radius-md);
  }

  /* 41절 환금성·경쟁 진단 — 중요한 순서대로 번호를 달고,
     판정(좋음/보통/주의)을 왼쪽 색 띠와 오른쪽 배지 두 군데로 드러낸다.
     예전엔 이모지 하나 + 줄글이라 "뭐가 문제인지" 훑어보기 어려웠다. */
  .mk-score { display: flex; align-items: center; gap: 12px; margin: 2px 0 14px; }
  .mk-score-num { font-size: 30px; font-weight: 800; line-height: 1; white-space: nowrap; }
  .mk-score-bar { flex: 1; height: 9px; border-radius: 999px; background: #eceef1; overflow: hidden; }
  .mk-score-fill { display: block; height: 100%; border-radius: 999px; }
  .mk-grade { font-size: 13.5px; font-weight: 700; white-space: nowrap; }

  .mk-item {
    border-left: 4px solid var(--border); background: #fbfcfd;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    padding: 11px 14px; margin-bottom: 9px;
  }
  .mk-item:last-child { margin-bottom: 0; }
  .mk-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .mk-rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 21px; height: 21px; border-radius: 50%; flex-shrink: 0;
    background: var(--ink); color: #fff; font-size: 12px; font-weight: 800;
  }
  .mk-title { font-size: 15.5px; font-weight: 800; color: var(--ink); }
  .mk-sub { font-size: 13px; color: var(--muted-2); font-weight: 600; }
  .mk-pill {
    margin-left: auto; padding: 3px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 800; white-space: nowrap;
  }
  .mk-text { font-size: 13.5px; line-height: 1.75; color: #3f454b; margin: 0; }
  .mk-lecture {
    margin: 7px 0 0; padding-left: 9px; border-left: 2px solid var(--border);
    font-size: 13px; line-height: 1.7; color: var(--muted);
  }
  .mk-good { border-left-color: #2f9e44; }
  .mk-good .mk-pill { background: #e6f4ea; color: #1e7a34; }
  .mk-good .mk-rank { background: #2f9e44; }
  .mk-ok { border-left-color: #9aa1a8; }
  .mk-ok .mk-pill { background: #eef0f2; color: #5c636a; }
  .mk-ok .mk-rank { background: #7c8288; }
  .mk-warn { border-left-color: #e0475a; background: #fff8f8; }
  .mk-warn .mk-pill { background: #fdecec; color: #c0293c; }
  .mk-warn .mk-rank { background: #e0475a; }
  .mk-info { border-left-color: #3b82c4; background: #f8fbfe; }
  .mk-info .mk-pill { background: #eaf2fa; color: #2c6ba3; }
  .mk-unknown { border-left-color: #d6dade; background: #fcfcfd; }
  .mk-unknown .mk-pill { background: #f1f2f4; color: #8b9197; }
  .mk-unknown .mk-rank { background: #b6bbc1; }
  /* 좁은 화면에서는 점수 막대가 등급 문구에 밀려 너무 짧아진다 — 등급을
     아랫줄로 내리고 막대에 최소 폭을 준다. */
  @media (max-width: 560px) {
    .mk-score { flex-wrap: wrap; }
    .mk-score-bar { min-width: 110px; }
    .mk-grade { order: 3; flex-basis: 100%; margin-top: 2px; }
  }

  /* 설명 문단을 한 덩어리로 흘려보내지 않고 문장 단위로 끊어 보여준다 —
     결과 페이지에 긴 안내 문장이 많아서, 줄글로 두면 눈이 어디를 읽고
     있는지 놓치기 쉽다는 지적을 반영했다. 각 줄 앞에 옅은 점을 찍어
     "여러 줄짜리 설명"임을 시각적으로도 드러낸다. */
  ul.note-lines { margin: 6px 0 0; padding: 0; list-style: none; }
  ul.note-lines li {
    position: relative; padding-left: 12px; margin-bottom: 5px;
    color: var(--muted); font-size: 14px; line-height: 1.8;
  }
  ul.note-lines li:last-child { margin-bottom: 0; }
  ul.note-lines li::before {
    content: ""; position: absolute; left: 0; top: 9px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--border);
  }

  /* 27-2절 — 핵심 비교거래 단지명 옆 네이버 검색 링크 아이콘 */
  .comp-search-link {
    display: inline-block; margin-left: 4px; text-decoration: none;
    font-size: 12px; opacity: .7;
  }
  .comp-search-link:hover { opacity: 1; }

  /* 27절 네이버부동산 CTA — 그냥 링크가 아니라 왜 눌러야 하는지 보이는
     큼직한 버튼형 카드로 */
  .naver-cta {
    display: flex; align-items: center; gap: 18px; margin: 2px 0 16px;
    padding: 26px 26px; border-radius: var(--radius-lg); text-decoration: none;
    color: #fff; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .12s ease;
  }
  .naver-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(3, 199, 90, .28); }
  .naver-cta-icon { font-size: 38px; flex-shrink: 0; }
  .naver-cta-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .naver-cta-title { font-size: 19px; font-weight: 800; line-height: 1.35; }
  .naver-cta-sub { font-size: 13.5px; opacity: .92; line-height: 1.5; }
  .naver-cta-arrow {
    flex-shrink: 0; font-size: 15px; font-weight: 700; padding: 14px 22px;
    background: rgba(255, 255, 255, .22); border-radius: 999px; white-space: nowrap;
  }
  @media (max-width: 520px) {
    .naver-cta { flex-wrap: wrap; }
    .naver-cta-icon { display: none; }
    .naver-cta-arrow { flex-basis: 100%; text-align: center; margin-top: 2px; }
  }

  /* 29절 가격 구간별 매도 전략 표 — 구간마다 색/굵기를 달리 줘서 한눈에
     구분되게 하고, 사용자들이 가장 많이 참고하는 "30일 목표가" 행은
     별도로 강조한다 */
  .tier-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .tier-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .tier-price { font-weight: 800; font-size: 19px; }
  .tier-table-wrap td { padding-top: 14px; padding-bottom: 14px; }
  .tier-table-wrap tr.tier-highlight td { background: var(--primary-tint); }
  .tier-table-wrap tr.tier-highlight .tier-price { color: var(--primary-dark); font-size: 22px; }
  .tier-badge-target {
    display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; background: var(--primary); color: #fff;
  }
  .speed-pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
  }
  .speed-pill.speed-vfast { background: #e6f9ee; color: #02a94d; }
  .speed-pill.speed-fast { background: #eef8e0; color: #5c8a10; }
  .speed-pill.speed-normal { background: #eef1fb; color: #3b4bb0; }
  .speed-pill.speed-slow { background: #fff4e0; color: #b9740a; }
  .speed-pill.speed-vslow { background: #fdecec; color: #d33232; }

  /* 가격 히어로 카드 */
  .hero {
    background: linear-gradient(165deg, #ffffff 0%, var(--primary-tint) 130%);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 24px 22px 20px; margin-bottom: 0; box-shadow: var(--shadow);
  }
  .hero-label { font-size: 13px; font-weight: 700; color: var(--primary-dark); }
  .hero-price { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 2px; color: var(--ink); }
  .hero-range { font-size: 14.5px; color: var(--muted); margin-bottom: 14px; }
  .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    background: var(--primary-tint); color: var(--primary-dark);
  }
  .badge.muted { background: #f1f2f4; color: var(--muted); }
  .badge.warn { background: #fff4e0; color: #b9740a; }

  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .price-item {
    padding: 11px 12px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
  }
  .price-item .label { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .price-item .value { font-size: 17.5px; font-weight: 800; margin-top: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 26px 4px 12px; color: var(--muted-2); font-size: 13.5px; font-weight: 800;
  }
  .section-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 700; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }

  .muted { color: var(--muted); font-size: 14px; line-height: 1.8; }
  ul.ref-list { margin: 4px 0 0 0; padding: 0; list-style: none; }
  ul.ref-list li {
    padding: 6px 0; font-size: 13.5px; color: #4a4f54;
    border-bottom: 1px dashed var(--border);
  }
  ul.ref-list li:last-child { border-bottom: none; }

  a.back {
    display: inline-block; margin-top: 6px; color: var(--primary-dark);
    text-decoration: none; font-size: 14px; font-weight: 700;
  }
  a.back:hover { text-decoration: underline; }

  footer { margin-top: 28px; color: var(--muted-2); font-size: 13px; line-height: 1.75; padding: 0 4px; }

  #loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(242, 244, 246, 0.96);
    z-index: 100; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px 16px; overflow-y: auto;
  }
  #loading-overlay.active { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--primary-tint); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay p { color: #444; font-size: 14px; margin: 0; text-align: center; max-width: 520px; }

  @media (max-width: 420px) {
    .hero-price { font-size: 32px; }
    .price-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  }
</style>
</head>
<body>
{% block content %}{% endblock %}
{% block footer %}
<footer>
  ⚠️ 이 결과는 국토교통부 실거래가 데이터를 통계적으로 가공한 참고용 추정치이며,
  실제 매도가를 보장하지 않습니다. 최종 판단은 공인중개사·감정평가사 등
  전문가 확인을 거치세요.
</footer>
{% endblock %}

<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-text">실거래가 조회 중이에요, 처음 보는 지역이면 최대 1~2분 정도 걸릴 수 있어요…</p>
</div>
<script>
  // 로딩이 길어질 때(특히 처음 조회하는 지역 — 비교거래마다 카카오 지오코딩을
  // 하나씩 호출해서 느림) 스피너만 덩그러니 있으면 지루하고 멈춘 것처럼
  // 보인다는 지적을 반영해, 실제 백엔드가 처리하는 순서 그대로 단계 문구를
  // 몇 초 간격으로 바꿔 보여주고(체감 대기시간을 줄이는 효과), 그 뒤로는
  // 이 프로젝트의 참고 팁을 계속 돌려서 오래 걸려도 화면이 비어 보이지 않게 한다.
  var LOADING_STEPS = [
    "주소를 좌표로 변환하는 중이에요…",
    "국토부 실거래가를 조회하는 중이에요…",
    "반경 안 비교거래를 찾는 중이에요…",
    "매도가를 계산하는 중이에요…",
  ];
  // 팁은 글자 한 줄짜리만 쓴다 — 3.5초씩 순서대로 돌린다.
  // 로딩 중 순환하는 글자 팁 (37절).
  // 팁 출처는 CLAUDE.md에 적어둔다 — 브라우저로 그대로 나가는 파일이라
  // 여기에는 출처를 쓰지 않는다(화면 문구도 같은 원칙, 42-1절).
  // 숫자가 들어간 팁은 "사례 기준"이라고 반드시 밝힌다 — 보장 수치가 아니고
  //   세법·금리는 시점마다 바뀌기 때문(이 프로젝트의 정직성 원칙과 동일).
  var LOADING_TIPS = [
    { text: "💡 경매 낙찰 후 빠르게 팔려면 보통 \"30일 목표가\" 근처가 적당해요" },
    { text: "💡 빌라는 아파트의 대체재예요 — 인근 아파트보다 비싸지면 잘 안 팔립니다" },
    { text: "💡 \"싸게 사는 것\"보다 \"실제로 팔릴 가격\"을 먼저 계산하는 게 순서예요" },
    { text: "💡 반지하는 보통 지상층 시세의 절반 수준으로 형성돼요" },
    { text: "💡 싸다고 다 팔리는 건 아니에요 — \"팔리는 빌라의 하한선\"을 잡는 게 핵심" },
    { text: "💡 빌라는 개별성이 강해서 실거래 한 건만 보고 가격을 정하면 위험해요" },
    { text: "💡 3층이 가장 인기 있고, 1층·6층은 상대적으로 덜 선호되는 편이에요" },
    { text: "💡 평당가만 맹신하지 마세요 — 면적·층·연식·상태가 섞이면 왜곡될 수 있어요" },
    { text: "💡 채광·엘리베이터·주차·누수·악취·소음·관리상태·경사는 임장 때 꼭 확인하세요" },
    { text: "💡 호가·실거래에도 업거래 같은 왜곡이 섞일 수 있어요 — 여러 건을 같이 보세요" },
    { text: "💡 경쟁을 피하는 하자 6단계: 입지 · 물종 · 물건 · 법리 · 절차 · 시장" },
    { text: "💡 \"하자 있는 물건\"이 아니라 \"통제 가능한 하자\"인지가 갈림길이에요" },
    { text: "💡 매도 전엔 네이버부동산에서 주변 경쟁 매물을 꼭 확인해보세요" },
    { text: "💡 수익률이 높은 물건일수록 환금성(빨리 팔리는 정도)은 낮아질 수 있어요" },
    { text: "💡 같은 건물이라도 수리 상태(올수리/기본/노후)에 따라 매도가능가격이 달라져요" },
    { text: "💡 현금:대출 3:7, 낙찰가는 투자금의 약 3~3.5배가 흔한 구조예요 — 사례 기준이라 보장 수치는 아닙니다" },
    { text: "💡 거래량 · 거래시기 · 면적 · 연식 · 상태 · 주변 아파트와의 가격차를 함께 보세요" },
    { text: "💡 취득세 중과배제 기준은 수도권 공시가 1억 · 지방 2억 이하 — 세법은 시점마다 달라지니 최신 기준을 꼭 확인하세요" },
    { text: "💡 명도는 인도명령까지 가도 길어야 3~6개월, 어려우면 대행을 씁니다(약 200만원 선)" },
    { text: "💡 투자금 5천~2억 구간은 수도권 비규제 빌라 올현금 단타가 주 타겟이에요 (사례 기준)" },
    { text: "💡 목표는 한 번의 대박이 아니라 반복 가능한 경매 투자 시스템이에요" },
    { text: "💡 처음 조회하는 지역은 지오코딩 때문에 조금 더 걸릴 수 있어요" },
  ];
  var TIP_MS_TEXT = 3500;

  document.querySelectorAll("form").forEach(function (form) {
    form.addEventListener("submit", function () {
      var btn = form.querySelector("button[type=submit]");
      if (btn) btn.disabled = true;
      document.getElementById("loading-overlay").classList.add("active");

      var textEl = document.getElementById("loading-text");

      function showTip(i) {
        textEl.textContent = LOADING_TIPS[i].text;
        setTimeout(function () {
          showTip((i + 1) % LOADING_TIPS.length);
        }, TIP_MS_TEXT);
      }

      var stepIdx = 0;
      textEl.textContent = LOADING_STEPS[0];
      var stepTimer = setInterval(function () {
        stepIdx++;
        if (stepIdx < LOADING_STEPS.length) {
          textEl.textContent = LOADING_STEPS[stepIdx];
          return;
        }
        clearInterval(stepTimer);
        showTip(0);
      }, 2200);
    });
  });
</script>
</body>
</html>
