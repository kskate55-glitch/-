{% extends "base.html" %}
{% block content %}
<h1>🔒 비밀번호 확인</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <div>
    <label>비밀번호</label>
    <input type="password" name="password" autofocus required>
  </div>
  <button type="submit">입장하기</button>
</form>
{% endblock %}
